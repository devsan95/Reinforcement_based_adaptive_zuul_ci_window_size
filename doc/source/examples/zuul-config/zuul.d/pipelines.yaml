# Check pipeline only — gate is defined in gate-pipeline.yaml with window
# sizing (window 20, TCP decrease rules) required for RL vs TCP validation.
- pipeline:
    name: check
    description: |
      Newly uploaded patchsets enter this pipeline to receive an
      initial +/-1 Verified vote. On success (Verified +1), Workflow +1
      promotes the change into gate (traditional check → gate flow).
    manager: independent
    require:
      gerrit:
        open: True
        current-patchset: True
    trigger:
      gerrit:
        - event: patchset-created
        - event: change-restored
        - event: comment-added
          comment: (?i)^(Patch Set [0-9]+:)?( [\w\\+-]*)*(\n\n)?\s*recheck
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

# Gate job: deterministic failures for presentable RL vs TCP demos.
#
# Fail rule (demo_batch, default), in priority order:
#   1. Stamped "Demo-Should-Fail:" trailer in this change's own commit
#      message (authoritative — supports adaptive/variable batch sizes
#      with a deterministic fail ratio).
#   2. Stamped "Demo-Batch-Index:" trailer < RESEARCH_FAIL_PER_BATCH
#      (legacy stamps).
#   3. change % 10 < RESEARCH_FAIL_PER_BATCH (no stamp at all).
#
# Metadata travels in the commit message, not a workspace file. An
# earlier revision stamped a shared demo-meta.json file instead; since
# every synthetic change in a batch is cloned from the same master HEAD
# (research/traffic/generator.py), each one produced a different diff to
# that same file, and Zuul's speculative gate merge would genuinely fail
# ("Unable to merge") whenever two such changes were stacked — well
# before this script ever ran. Commit messages are per-commit and never
# conflict when trees are merged, so reading the trailers below instead
# removes that failure mode entirely.
#
# Legacy demo7: fail when change % 7 in {0,1,2} → exactly 3/7.
- hosts: all
  gather_facts: false
  tasks:
    - name: Simulate gate build with deterministic failures for RL demo
      shell: |
        set -e
        sleep "${RESEARCH_GATE_SLEEP_SEC:-1}"
        python3 - <<'PY'
        import hashlib
        import os
        import random
        import re
        import subprocess
        import sys
        from pathlib import Path

        build = os.environ.get("ZUUL_UUID", "")
        change = os.environ.get("ZUUL_CHANGE", "0")
        mode = os.environ.get("RESEARCH_FAIL_MODE", "demo_batch")
        rate = float(os.environ.get("RESEARCH_FAILURE_RATE", "0.80"))
        every = max(1, int(os.environ.get("RESEARCH_FAIL_EVERY", "5")))
        fail_per_batch = max(0, int(os.environ.get(
            "RESEARCH_FAIL_PER_BATCH", "5")))
        force_fail = os.environ.get("RESEARCH_FORCE_FAIL", "").lower() in (
            "1", "true", "yes",
        )

        TRAILER_RE = re.compile(r'^Demo-([A-Za-z-]+):\s*(.*)$')

        def load_batch_meta():
            """Parse Demo-* trailers from this change's own commit message.

            Reads via `git log -1 --format=%B`, not a workspace file: a
            file every change in a batch stamps differently would give
            Zuul's speculative gate merge a genuine conflict to fail on
            (see the module header comment) before this script ever ran.
            Commit messages are per-commit and merge cleanly regardless.
            """
            search_dirs = [Path(".")]
            search_dirs.extend(p.parent for p in Path(".").rglob(".git"))
            for d in search_dirs:
                try:
                    out = subprocess.run(
                        ["git", "log", "-1", "--format=%B"],
                        cwd=str(d), capture_output=True, text=True,
                        timeout=10, check=True).stdout
                except (OSError, subprocess.SubprocessError):
                    continue
                meta = {}
                for line in out.splitlines():
                    m = TRAILER_RE.match(line.strip())
                    if not m:
                        continue
                    key = m.group(1).lower().replace("-", "_")
                    meta[key] = m.group(2).strip()
                if "should_fail" in meta:
                    meta["should_fail"] = meta["should_fail"] in (
                        "1", "true", "True")
                if meta:
                    return meta
            return None

        def batch_should_fail(batch_index, n_fail):
            return int(batch_index) < int(n_fail)

        if change.isdigit():
            key = int(change)
        else:
            key = int(hashlib.md5((build or "0").encode()).hexdigest()[:8], 16)

        meta = load_batch_meta()
        batch_index = None
        stamped_should_fail = None
        if isinstance(meta, dict):
            if meta.get("batch_index") is not None:
                try:
                    batch_index = int(meta["batch_index"])
                except (TypeError, ValueError):
                    batch_index = None
            if meta.get("should_fail") is not None:
                stamped_should_fail = bool(meta["should_fail"])
        if batch_index is None:
            env_idx = os.environ.get("RESEARCH_BATCH_INDEX", "")
            if env_idx.isdigit():
                batch_index = int(env_idx)

        if force_fail:
            should_fail = True
        elif mode in ("demo_batch", "continuous"):
            # Stamped should_fail is authoritative (adaptive batch sizes);
            # then stamped batch_index; last resort change % 10.
            if stamped_should_fail is not None:
                should_fail = stamped_should_fail
            elif batch_index is not None:
                should_fail = batch_should_fail(batch_index, fail_per_batch)
            else:
                should_fail = (key % 10) < fail_per_batch
        elif mode == "demo7":
            should_fail = (key % 7) in (0, 1, 2)
        elif mode == "every_nth":
            should_fail = key > 0 and (key % every) == 0
        elif mode == "alternate":
            should_fail = (key % 2) == 0
        else:
            should_fail = random.random() < rate

        banner = "=" * 60
        if should_fail:
            print(banner, flush=True)
            print(
                f"research-gate-job: *** FAILURE *** "
                f"(mode={mode}, stamped={stamped_should_fail}, "
                f"batch_index={batch_index}, "
                f"fail_per_batch={fail_per_batch}, every={every}, "
                f"rate={rate}, force={force_fail}, change={change}, "
                f"build={build[:8]})",
                flush=True,
            )
            print(banner, flush=True)
            sys.exit(1)
        print(banner, flush=True)
        print(
            f"research-gate-job: +++ SUCCESS +++ "
            f"(mode={mode}, stamped={stamped_should_fail}, "
            f"batch_index={batch_index}, "
            f"fail_per_batch={fail_per_batch}, every={every}, "
            f"rate={rate}, force={force_fail}, change={change}, "
            f"build={build[:8]})",
            flush=True,
        )
        print(banner, flush=True)
        PY
      environment:
        ZUUL_UUID: "{{ zuul.build }}"
        ZUUL_CHANGE: "{{ zuul.change }}"
        RESEARCH_FAIL_MODE: "{{ research_fail_mode | default('demo_batch') }}"
        RESEARCH_FAIL_EVERY: "{{ research_fail_every | default('5') }}"
        RESEARCH_FAIL_PER_BATCH: "{{ research_fail_per_batch | default('5') }}"
        RESEARCH_FAILURE_RATE: "{{ research_failure_rate | default('0.80') }}"
        RESEARCH_FORCE_FAIL: "{{ research_force_fail | default('false') }}"
        RESEARCH_GATE_SLEEP_SEC: "{{ research_gate_sleep_sec | default('1') }}"

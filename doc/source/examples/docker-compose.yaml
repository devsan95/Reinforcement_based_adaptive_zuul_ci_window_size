
services:
  gerrit:
    # This is a mirror of:
    # image: docker.io/gerritcodereview/gerrit
    image: quay.io/opendevmirror/gerrit
    ports:
      - "8080:8080"
      - "29418:29418"
    environment:
      - CANONICAL_WEB_URL=http://localhost:8080/
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 36
      start_period: 120s
    networks:
      - zuul
    volumes:
      - "gerrit-etc:/var/gerrit/etc"
      - "gerrit-db:/var/gerrit/db"
      - "gerrit-git:/var/gerrit/git"
      - "gerrit-index:/var/gerrit/index"
      - "gerrit-cache:/var/gerrit/cache"
  gerritconfig:
    image: quay.io/zuul-ci/zuul-executor
    restart: "no"
    environment:
      - http_proxy
      - https_proxy
      - no_proxy=${no_proxy},gerrit
    depends_on:
      gerrit:
        condition: service_healthy
    volumes:
      - "sshkey:/var/ssh:z"
      - "nodessh:/var/node:z"
      - "./playbooks/:/var/playbooks/:z"
      - "certs:/var/certs:z"
      - "../../../tools/:/var/zuul-tools/:z"
      - "lib-zuul-executor:/var/lib/zuul:z"
    # NOTE(pabelanger): Be sure to update this line each time we change the
    # default version of ansible for Zuul.
    command: "/usr/local/lib/zuul/ansible/9/bin/ansible-playbook /var/playbooks/setup.yaml"
    networks:
      - zuul
  zk:
    # This is a mirror of:
    # image: docker.io/zookeeper
    image: quay.io/opendevmirror/zookeeper
    hostname: examples_zk_1.examples_default
    depends_on:
      gerritconfig:
        condition: service_completed_successfully
    volumes:
      - "./playbooks/:/var/playbooks/:z"
      - "certs:/var/certs:z"
      - "./zoo.cfg:/conf/zoo.cfg:z"
      - "zk-data:/data"
      - "zk-datalog:/datalog"
    command: "sh -c '/var/playbooks/wait-to-start-certs.sh && exec zkServer.sh start-foreground'"
    networks:
      - zuul
  mysql:
    # This is a mirror of:
    # image: docker.io/mariadb
    image: quay.io/opendevmirror/mariadb
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: zuul
      MYSQL_USER: zuul
      MYSQL_PASSWORD: secret
      # Work around slow db startup when writing TZINFO data.
      MYSQL_INITDB_SKIP_TZINFO: 1
    volumes:
      - "lib-mysql:/var/lib/mysql"
    networks:
      - zuul
  scheduler:
    depends_on:
      gerritconfig:
        condition: service_completed_successfully
      zk:
        condition: service_started
      mysql:
        condition: service_started
    environment:
      - http_proxy
      - https_proxy
      - no_proxy=${no_proxy},gerrit
      - ZUUL_MYSQL_PASSWORD=secret
    command: |
      sh -c '/var/playbooks/wait-to-start-certs.sh && \
             /var/playbooks/wait-to-start.sh && \
             exec zuul-scheduler -f'
    # FIXME: The scheduler has no ansible anymore so use the executor image.
    #        This needs to be changes such that ansible is not required for startup.
    image: quay.io/zuul-ci/zuul-scheduler
    volumes:
      - "${ZUUL_TUTORIAL_CONFIG:-./etc_zuul/}:/etc/zuul/:z"
      - "./playbooks/:/var/playbooks/:z"
      - "sshkey:/var/ssh:z"
      - "certs:/var/certs:z"
      - "lib-zuul-scheduler:/var/lib/zuul"
    networks:
      - zuul
  web:
    depends_on:
      gerritconfig:
        condition: service_completed_successfully
      mysql:
        condition: service_started
    command: |
      sh -c '/var/playbooks/wait-to-start-certs.sh && \
             exec zuul-web -f'
    ports:
      - "19090:9000"
    image: quay.io/zuul-ci/zuul-web
    environment:
      ZUUL_MYSQL_PASSWORD: secret
    volumes:
      - "${ZUUL_TUTORIAL_CONFIG:-./etc_zuul/}:/etc/zuul/:z"
      - "./playbooks/:/var/playbooks/:z"
      - "certs:/var/certs:z"
      - "lib-zuul-web:/var/lib/zuul"
    networks:
      - zuul
  executor:
    depends_on:
      gerritconfig:
        condition: service_completed_successfully
      scheduler:
        condition: service_started
      launcher:
        condition: service_started
    privileged: true
    environment:
      - http_proxy
      - https_proxy
      - no_proxy=${no_proxy},gerrit,scheduler
      - ZUUL_MYSQL_PASSWORD=secret
      # Per-playbook Ansible concurrency (jobs still limited by slots /
      # max_starting_builds). Waiting builds usually mean too few nodes.
      - ANSIBLE_FORKS=40
    image: quay.io/zuul-ci/zuul-executor
    volumes:
      - "${ZUUL_TUTORIAL_CONFIG:-./etc_zuul/}:/etc/zuul/:z"
      - "./playbooks/:/var/playbooks/:z"
      - "sshkey:/var/ssh:z"
      - "logs:/srv/static/logs:z"
      - "certs:/var/certs:z"
      - "lib-zuul-executor:/var/lib/zuul:z"
    command: "sh -c '/var/playbooks/wait-to-start-certs.sh && exec zuul-executor -f'"
    networks:
      - zuul
  node:
    build:
      dockerfile: node-Dockerfile
      context: ./
      args:
        http_proxy: "${http_proxy}"
        https_proxy: "${http_proxy}"
        no_proxy: "${no_proxy},gerrit"
    volumes:
      - "nodessh:/root/.ssh:z"
    # Alias covers stale ZK slot-hosts left as `node-cap50` after a slots
    # resize rename cycle. Compose DNS name must remain `node`.
    networks:
      zuul:
        aliases:
          - node
          - node-cap50
  launcher:
    depends_on:
      gerritconfig:
        condition: service_completed_successfully
      scheduler:
        condition: service_started
    image: quay.io/zuul-ci/zuul-launcher
    volumes:
      - "${ZUUL_TUTORIAL_CONFIG:-./etc_zuul/}:/etc/zuul/:z"
      - "./playbooks/:/var/playbooks/:z"
      - "certs:/var/certs:z"
      - "lib-zuul-launcher:/var/lib/zuul"
    command: "sh -c '/var/playbooks/wait-to-start-certs.sh && exec zuul-launcher -f'"
    networks:
      - zuul
  logs:
    build:
      dockerfile: logs-Dockerfile
      context: ./
      args:
        http_proxy: "${http_proxy}"
        https_proxy: "${http_proxy}"
        no_proxy: "${no_proxy}"
    ports:
      - "8000:80"
    volumes:
      - "logs:/usr/local/apache2/htdocs:z"
    networks:
      - zuul

volumes:
  sshkey:
  nodessh:
  logs:
  certs:
  lib-zuul-scheduler:
  lib-zuul-web:
  lib-zuul-executor:
  lib-zuul-launcher:
  zk-data:
  zk-datalog:
  lib-mysql:
  gerrit-etc:
  gerrit-db:
  gerrit-git:
  gerrit-index:
  gerrit-cache:

networks:
  zuul:

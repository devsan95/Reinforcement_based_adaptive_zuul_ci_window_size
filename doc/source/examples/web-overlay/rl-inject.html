        };
      }

      function setDemoInputsDisabled(panel, disabled) {
        if (!panel) {
          return;
        }
        ['#zuul-rl-total-changes', '#zuul-rl-gate-failures'].forEach(
          function (sel) {
            var inp = panel.querySelector(sel);
            if (inp) {
              inp.disabled = !!disabled;
            }
          });
      }

      function applyDemoInputDefaults(panel, metrics, statusData) {
        if (!panel || demoInputsPrefillDone) {
          return;
        }
        var totalInp = panel.querySelector('#zuul-rl-total-changes');
        var failsInp = panel.querySelector('#zuul-rl-gate-failures');
        if (!totalInp || !failsInp) {
          return;
        }
        var src = statusData || metrics || {};
        var changes = numOrNull(src.default_total_changes);
        if (changes == null) {
          changes = numOrNull(src.demo_change_count);
        }
        if (changes == null) {
          changes = DEMO_CHANGE_COUNT;
        }
        var fails = numOrNull(src.default_gate_failures);
        if (fails == null) {
          fails = numOrNull(src.default_expected_failures);
        }
        if (fails == null) {
          fails = numOrNull(src.expected_failures);
        }
        if (fails == null) {
          fails = DEMO_EXPECTED_FAILURES;
        }
        DEMO_CHANGE_COUNT = Math.max(0, Math.round(changes));
        DEMO_EXPECTED_FAILURES = Math.max(0, Math.round(fails));
        // Sync once from server defaults unless the user already edited.
        if (totalInp.getAttribute('data-user-edited') !== '1') {
          totalInp.value = String(DEMO_CHANGE_COUNT);
        }
        if (failsInp.getAttribute('data-user-edited') !== '1') {
          failsInp.value = String(DEMO_EXPECTED_FAILURES);
        }
        demoInputsPrefillDone = true;
      }

      function expectedFailuresFrom(metrics, prog) {
        if (prog && prog.expected_failures != null &&
            !isNaN(Number(prog.expected_failures))) {
          return Math.max(0, Math.round(Number(prog.expected_failures)));
        }
        if (metrics && metrics.expected_failures != null &&
            !isNaN(Number(metrics.expected_failures))) {
          return Math.max(0, Math.round(Number(metrics.expected_failures)));
        }
        return DEMO_EXPECTED_FAILURES;
      }
      var lastMetrics = null;
      var lastStatusData = null;
      var demoPollTimer = null;
      var demoLiveMetricsTimer = null;
      var demoRunning = false;
      var metricsInFlight = false;
      var chartDrawPending = false;
      var badgeEnhanceTimer = null;
      var statusPollTimer = null;
      var gridRefreshTimer = null;
      // Connection / staleness watchdog state. Staleness is measured as
      // local time since the server-side progress stamp last CHANGED —
      // never by comparing server clocks to the browser clock (container
      // clocks can drift hours from the host under Docker Desktop).
      var liveMetricsFailStreak = 0;
      var demoProgressFailStreak = 0;
      var lastSeenProgressStamp = 0;
      var lastProgressChangeLocalMs = 0;
      var STALE_PROGRESS_WARN_SEC = 30;
      var CONN_LOST_AFTER_FAILURES = 2;

      var DEMO_PHASE_LABELS = {
        starting: 'Starting demo',
        waiting_audit: 'Waiting for RL audit',
        resetting_windows: 'Resetting windows',
        clearing_queues: 'Clearing pipeline queues',
        submitting_traffic: 'Submitting changes',
        waiting_gate_cycles: 'Waiting for gate cycles',
        generating_report: 'Generating report',
        publishing: 'Publishing report',
        done: 'Demo complete',
        error: 'Demo failed'
      };

      function formatMmSs(sec) {
        sec = Math.max(0, Math.floor(sec || 0));
        var m = Math.floor(sec / 60);
        var s = sec % 60;
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      function renderDemoWarning(panel, text) {
        var warn = panel.querySelector('#zuul-rl-demo-warning');
        if (!warn) {
          return;
        }
        if (text) {
          warn.textContent = '\u26a0 ' + text;
          warn.style.display = 'block';
        } else {
          warn.style.display = 'none';
          warn.textContent = '';
        }
      }

      function checkProgressStaleness(prog) {
        // Watchdog: warn when the demo worker stops publishing progress.
        var panel = document.getElementById(PANEL_ID);
        if (!panel) {
          return;
        }
        if (!demoRunning || !prog) {
          lastSeenProgressStamp = 0;
          lastProgressChangeLocalMs = 0;
          renderDemoWarning(panel, null);
          return;
        }
        var stamp = prog.progress_updated_at || 0;
        if (stamp !== lastSeenProgressStamp) {
          lastSeenProgressStamp = stamp;
          lastProgressChangeLocalMs = Date.now();
        }
        if (!lastProgressChangeLocalMs) {
          lastProgressChangeLocalMs = Date.now();
        }
        var staleFor = (Date.now() - lastProgressChangeLocalMs) / 1000;
        if (staleFor > STALE_PROGRESS_WARN_SEC) {
          renderDemoWarning(panel,
            'No progress update for ' + Math.round(staleFor) +
            's — demo worker may be stuck (phase: ' +
            (prog.phase || 'unknown') + ').');
        } else {
          renderDemoWarning(panel, null);
        }
      }

      function renderDemoProgress(prog) {
        var panel = document.getElementById(PANEL_ID);
        if (!panel) {
          return;
        }
        var block = panel.querySelector('#zuul-rl-demo-progress');
        var phaseEl = panel.querySelector('#zuul-rl-demo-phase');
        var detailEl = panel.querySelector('#zuul-rl-demo-detail');
        var bar = panel.querySelector('#zuul-rl-demo-bar');
        var extendBtn = panel.querySelector('#zuul-rl-extend-btn');
        if (!block || !phaseEl || !detailEl || !bar) {
          return;
        }
        if (!prog || !demoRunning) {
          block.classList.remove('zuul-rl-demo-active');
          bar.classList.remove('zuul-rl-demo-indeterminate');
          bar.style.width = '0%';
          renderDemoWarning(panel, null);
          setDemoInputsDisabled(panel, false);
          if (extendBtn) {
            extendBtn.style.display = 'none';
          }
          return;
        }
        block.classList.add('zuul-rl-demo-active');
        setDemoInputsDisabled(panel, true);
        if (prog.expected_failures != null &&
            !isNaN(Number(prog.expected_failures))) {
          DEMO_EXPECTED_FAILURES = Math.max(
            0, Math.round(Number(prog.expected_failures)));
        }
        if (prog.total_changes != null &&
            !isNaN(Number(prog.total_changes))) {
          DEMO_CHANGE_COUNT = Math.max(
            0, Math.round(Number(prog.total_changes)));
        }
        var phase = prog.phase || 'starting';
        var label = DEMO_PHASE_LABELS[phase] || phase;
        var pct = prog.percent != null ? prog.percent : 0;
        phaseEl.textContent = label + (pct > 0 ? ' (' + pct + '%)' : '');
        var parts = [];
        var batchesDone = prog.batches_completed || 0;
        var batchesPlan = Math.max(prog.batches_planned || 0, batchesDone);
        var batchCurrent = Number(prog.batch_current);
        if (!batchCurrent || isNaN(batchCurrent)) {
          // Fallback when older control server omits batch_current.
          batchCurrent = prog.traffic_active
            ? Math.max(batchesDone, batchesPlan > 0 ? 1 : 0)
            : batchesDone;
        }
        var batchTipEl = panel.querySelector('#zuul-rl-demo-batch-tip');
        if (batchesPlan > 0 || batchesDone > 0 || batchCurrent > 0) {
          var showX = Math.max(batchCurrent, batchesDone);
          var showY = Math.max(batchesPlan, showX);
          parts.push(
            'Batch ' + showX + ' of ' + showY +
            ' \u2014 submitting changes in groups');
          if (detailEl) {
            detailEl.title =
              'X = current batch index · Y = planned batches for this demo';
          }
        }
        if (prog.changes_submitted > 0) {
          parts.push(prog.changes_submitted + ' changes');
        }
        if (prog.time_remaining_s != null && prog.traffic_active) {
          parts.push('~' + formatMmSs(prog.time_remaining_s) + ' left');
        }
        if (prog.failures_so_far > 0) {
          parts.push(prog.failures_so_far + ' stamped fails');
        }
        if (prog.extra_in_flight > 0) {
          parts.push('+' + prog.extra_in_flight + ' extra in flight');
        }
        if (prog.message && parts.length < 2) {
          parts.push(prog.message);
        } else if (prog.message && phase === 'clearing_queues') {
          parts = [prog.message];
        }
        if (prog.elapsed_s > 0 && !prog.traffic_active) {
          parts.push(prog.elapsed_s + 's elapsed');
        }
        detailEl.textContent = parts.join(' \u00b7 ');
        if (batchTipEl) {
          var tip = prog.batches_plan_tip || '';
          if (!tip && batchesPlan > 0) {
            var interval = prog.batch_interval_sec || 20;
            var duration = prog.duration_sec || 300;
            var batchSize = prog.batch_size || DEMO_BATCH_SIZE || 10;
            if (prog.total_changes != null && Number(prog.total_changes) > 0) {
              tip = 'Y = ' + batchesPlan + ': ' + prog.total_changes +
                ' changes \u00f7 ' + batchSize + ' per batch';
            } else {
              var mins = Math.max(1, Math.round(Number(duration) / 60));
              tip = 'Y = ' + batchesPlan + ': ~' + mins +
                ' min session \u00f7 ' + Math.round(Number(interval)) +
                's interval';
            }
          }
          if (tip) {
            batchTipEl.textContent = tip;
            batchTipEl.style.display = '';
            batchTipEl.title =
              'Y is planned batches: defaults ~5 min session \u00f7 ~20s ' +
              'interval \u2248 15, or Changes \u00f7 batch size when set.';
          } else {
            batchTipEl.textContent = '';
            batchTipEl.style.display = 'none';
            batchTipEl.removeAttribute('title');
          }
        }
        // Keep Session summary Failures X/Y + Submitted in sync with progress.
        var failCard = panel.querySelector('#zuul-rl-hl-failures');
        if (failCard) {
          var failX = 0;
          if (lastMetrics) {
            failX = getSessionSummary(lastMetrics).gate_failures || 0;
          }
          failCard.textContent = failX + '/' + DEMO_EXPECTED_FAILURES;
        }
        var submittedCard = panel.querySelector('#zuul-rl-hl-submitted');
        if (submittedCard && prog.changes_submitted != null &&
            !isNaN(Number(prog.changes_submitted))) {
          submittedCard.textContent = String(
            Math.max(0, Math.round(Number(prog.changes_submitted))));
        }
        if (extendBtn) {
          var showExtend = !!(prog.extend_available || prog.traffic_active ||
            (demoRunning && phase === 'submitting_traffic'));
          extendBtn.style.display = showExtend ? 'inline-block' : 'none';
          extendBtn.disabled = !showExtend;
        }
        bar.classList.remove('zuul-rl-demo-indeterminate');
        if (pct > 0 && pct < 100) {
          bar.style.width = pct + '%';
        } else if (phase === 'done') {
          bar.style.width = '100%';
        } else {
          bar.classList.add('zuul-rl-demo-indeterminate');
        }
      }

      function scheduleGridRefresh() {
        if (gridRefreshTimer) {
          clearInterval(gridRefreshTimer);
        }
        gridRefreshTimer = setInterval(
          nudgeZuulGridRefresh,
          demoRunning ? GRID_REFRESH_DEMO_MS : GRID_REFRESH_MS
        );
      }

      function onDemoRunningChanged() {
        scheduleStatusPollInterval();
        scheduleGridRefresh();
        if (lastStatusData) {
          render(lastStatusData);
        }
      }

      function startDemoPolling() {
        demoRunning = true;
        onDemoRunningChanged();
        var panel = document.getElementById(PANEL_ID);
        setDemoInputsDisabled(panel, true);
        if (demoPollTimer) {
          clearInterval(demoPollTimer);
        }
        if (demoLiveMetricsTimer) {
          clearInterval(demoLiveMetricsTimer);
        }
        pollDemoProgress();
        updateLiveMetrics();
        demoPollTimer = setInterval(pollDemoProgress, DEMO_POLL_MS);
        demoLiveMetricsTimer = setInterval(updateLiveMetrics, LIVE_POLL_MS);
      }

      function stopDemoPolling() {
        demoRunning = false;
        if (demoPollTimer) {
          clearInterval(demoPollTimer);
          demoPollTimer = null;
        }
        if (demoLiveMetricsTimer) {
          clearInterval(demoLiveMetricsTimer);
          demoLiveMetricsTimer = null;
        }
        renderDemoProgress(null);
        var panel = document.getElementById(PANEL_ID);
        setDemoInputsDisabled(panel, false);
        onDemoRunningChanged();
      }

      function pollDemoProgress() {
        if (!window.location.pathname.includes('/status')) {
          return;
        }
        var panel = ensureReportPanel();
        fetch(CONTROL_BASE + '/demo-progress', { cache: 'no-store' })
          .then(function (resp) {
            if (!resp.ok) {
              throw new Error('demo progress unavailable');
            }
            return resp.json();
          })
          .then(function (prog) {
            demoProgressFailStreak = 0;
            var btn = panel.querySelector('#zuul-rl-run-btn');
            var running = !!prog.running;
            if (demoRunning !== running) {
              demoRunning = running;
              onDemoRunningChanged();
            }
            if (btn) {
              btn.disabled = running;
              btn.textContent = running ? 'Running...' : 'Run demo';
            }
            renderDemoProgress(prog);
            checkProgressStaleness(prog);
            if (!running) {
              stopDemoPolling();
              refreshAllParallel();
              pollStatus();
            }
          })
          .catch(function () {
            demoProgressFailStreak += 1;
            if (demoRunning &&
                demoProgressFailStreak >= CONN_LOST_AFTER_FAILURES) {
              renderDemoWarning(panel,
                'Connection to demo controller lost — retrying\u2026 ' +
                '(values shown may be stale)');
            }
          });
      }

      function scheduleChartDraw(metrics, panel) {
        if (chartDrawPending) {
          return;
        }
        chartDrawPending = true;
        requestAnimationFrame(function () {
          chartDrawPending = false;
          if (!panel || !metrics) {
            return;
          }
          var windowCanvas = panel.querySelector('#zuul-rl-window-chart');
          var throughputCanvas = panel.querySelector('#zuul-rl-throughput-chart');
          var efficiencyCanvas = panel.querySelector('#zuul-rl-efficiency-chart');
          var extraCanvas = panel.querySelector('#zuul-rl-extra-chart');
          var failuresEl = panel.querySelector('#zuul-rl-failures');
          var compareEl = panel.querySelector('#zuul-rl-comparison');
          var status = panel.querySelector('#zuul-rl-status');

          drawLineChart(windowCanvas, [
            { color: '#06c', values: metrics.rl_window || [], label: 'RL' },
            { color: '#f0ab00', values: metrics.tcp_window || [], label: 'TCP' }
          ], {
            timestamps: metrics.timestamps,
            failures: metrics.failures,
            ylabel: 'window size',
            showChangeIds: true,
            annotateWindows: true
          });

          drawLineChart(throughputCanvas, [
            { color: '#3e8635', values: metrics.throughput || [] }
          ], {
            timestamps: metrics.timestamps,
            failures: metrics.failures,
            ylabel: 'builds/min'
          });

          var effSeries = (metrics.throughput_efficiency || []).map(function (v) {
            return v == null ? null : v;
          });
          drawLineChart(efficiencyCanvas, [
            { color: '#06c', values: effSeries }
          ], {
            timestamps: metrics.timestamps,
            failures: metrics.failures,
            ylabel: 'advantage %'
          });

          drawExtraBarChart(extraCanvas, metrics.failures || []);

          renderFailures(
            failuresEl, metrics.failures, metrics.failure_counts, metrics);
          renderSessionSummary(panel, metrics);
          renderLiveLine(panel, metrics);
          renderComparisonTable(compareEl, metrics);
          renderDecisionReason(panel, metrics);

          if (status && metrics.latest && !status.classList.contains('zuul-rl-status-error')) {
            // Ops-only status — metrics live in Session / Live sections.
            if (demoRunning) {
              status.textContent =
                'Demo running — progress above; session & live below.';
              status.className = 'zuul-rl-status-line zuul-rl-status-running';
            } else if ((getSessionSummary(metrics).gate_failures || 0) > 0 ||
                       metrics.demo_phase === 'done') {
              status.textContent =
                metrics.demo_phase === 'done' ?
                  'Demo complete — session summary below.' :
                  'Live — session & live metrics below.';
              status.className = 'zuul-rl-status-line zuul-rl-status-live';
            } else {
              status.textContent =
                'Ready — Run demo for a ~5 min continuous traffic session.';
              status.className = 'zuul-rl-status-line';
            }
          }
        });
      }

      function renderLiveLine(panel, metrics) {
        var el = panel.querySelector('#zuul-rl-live-line');
        if (!el) {
          return;
        }
        var summary = getSessionSummary(metrics);
        var live = summary.live || {};
        var latest = (metrics && metrics.latest) || {};
        var rlWin = live.rl_window != null ? live.rl_window : latest.rl_window;
        var tcpWin = live.tcp_window != null ? live.tcp_window : latest.tcp_window;
        if (rlWin == null || tcpWin == null) {
          el.className = '';
          el.textContent = 'Live: waiting for window data\u2026';
          return;
        }
        var q = live.gate_queue_count != null ? live.gate_queue_count :
          (latest.gate_queue_count != null ? latest.gate_queue_count : 0);
        var liveExtra = live.extra_in_flight != null ? live.extra_in_flight : 0;
        var maxWin = Math.max(rlWin, tcpWin || 0);
        var target = latest.queue_target != null ? latest.queue_target : maxWin;
        var saturated = latest.queue_saturated != null ?
          latest.queue_saturated : (q >= maxWin && maxWin > 0);
        el.className = saturated ? 'zuul-rl-sat-ok' : 'zuul-rl-sat-low';
        el.innerHTML =
          '<strong>Live</strong> · RL <span class="zuul-rl-live-rl">' + rlWin +
          '</span> / TCP <span class="zuul-rl-live-tcp">' + tcpWin +
          '</span> · queue ' + q +
          (liveExtra > 0 ? ' · +' + liveExtra + ' extra in flight' : '') +
          (saturated ?
            ' · saturated' :
            ' · topping up (queue &lt; ' + target + ')');
      }

      function renderDecisionReason(panel, metrics) {
        var el = panel.querySelector('#zuul-rl-decision-reason');
        if (!el) {
          return;
        }
        var latest = (metrics && metrics.latest) || {};
        var reason = latest.rl_decision_reason;
        var source = latest.rl_decision_source;
        var detail = latest.rl_decision_detail;
        function esc(s) {
          return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/"/g, '&quot;');
        }
        if (reason) {
          // Plain-English reason only; method/kNN behind Details.
          var tipParts = [];
          if (source) {
            tipParts.push('method: ' + source);
          }
          if (detail) {
            tipParts.push(String(detail));
          }
          var tip = tipParts.length ? tipParts.join(' \u00b7 ') : '';
          var wasOpen = false;
          var prevDetails = el.querySelector('details.zuul-rl-reason-debug');
          if (prevDetails && prevDetails.open) {
            wasOpen = true;
          }
          var html = '<span class="zuul-rl-reason-label">RL:</span> ' +
            esc(reason);
          if (tip) {
            html +=
              ' <details class="zuul-rl-reason-debug"' +
              (wasOpen ? ' open' : '') + '>' +
              '<summary>Details</summary>' +
              '<span class="zuul-rl-reason-debug-body">' + esc(tip) +
              '</span></details>';
            el.title = tip;
          } else {
            el.removeAttribute('title');
          }
          el.innerHTML = html;
        } else {
          el.innerHTML = '<span class="zuul-rl-reason-label">RL:</span> ' +
            'waiting for first agent tick\u2026';
          el.removeAttribute('title');
        }
      }

      function renderSessionSummary(panel, metrics) {
        if (!panel || !metrics) {
          return;
        }
        var summary = getSessionSummary(metrics);
        var targetN = expectedFailuresFrom(metrics, null);
        DEMO_EXPECTED_FAILURES = targetN;
        var failN = summary.gate_failures || 0;
        var sessionExtra = summary.extra_changes_total || 0;
        var advPct = summary.rl_advantage_pct;
        var heldRl = summary.rl_held_peak;
        var heldTcp = summary.tcp_after_floor;
        var merged = summary.merged != null ?
          summary.merged : (summary.session_changes_merged || 0);
        var submitted = summary.changes_submitted != null ?
          summary.changes_submitted : (summary.submitted || 0);
        var el;

        el = panel.querySelector('#zuul-rl-hl-submitted');
        if (el) {
          el.textContent = String(submitted != null && !isNaN(Number(submitted)) ?
            submitted : 0);
        }
        el = panel.querySelector('#zuul-rl-hl-merged');
        if (el) {
          el.textContent = String(merged != null && !isNaN(Number(merged)) ?
            merged : 0);
        }
        el = panel.querySelector('#zuul-rl-hl-failures');
        if (el) {
          el.textContent = failN + '/' + targetN;
        }
        el = panel.querySelector('#zuul-rl-hl-extra');
        if (el) {
          el.textContent = String(sessionExtra);
        }
        el = panel.querySelector('#zuul-rl-hl-adv');
        if (el) {
          var idle = sessionExtra <= 0 && failN <= 0;
          if (advPct == null || isNaN(Number(advPct)) ||
              (Number(advPct) === 0 && idle)) {
            el.textContent = '\u2014';
          } else {
            el.textContent = Number(advPct) + '%' +
              (summary.advantage_capped ? '*' : '');
          }
        }
        el = panel.querySelector('#zuul-rl-hl-peak');
        if (el) {
          if (heldRl != null && heldTcp != null &&
              !isNaN(Number(heldRl)) && !isNaN(Number(heldTcp))) {
            el.textContent = heldRl + ' / ' + heldTcp;
          } else {
            el.textContent = '\u2014';
          }
        }

        var doneBanner = panel.querySelector('#zuul-rl-done-banner');
        if (doneBanner) {
          var done = metrics.demo_phase === 'done' && !demoRunning;
          doneBanner.style.display = done ? 'block' : 'none';
          if (done) {
            doneBanner.textContent =
              '\u2713 Demo complete — RL kept the gate open while TCP backed off';
          }
        }

        var tipAdv = (summary.advantage_formula ||
          'sum(extra at failures) / sum(TCP_after at failures) \u00d7 100') +
          (summary.advantage_capped ?
            ' (*display capped; raw ' + summary.rl_advantage_pct_raw + '%)' : '');
        var tipPeak =
          'Session peak at gate failures (not live): max RL held vs min TCP after shrink. ' +
          'Live RL/TCP are in the Live & decision section.';
        var tipExtra =
          'Session total extras accommodated vs TCP = sum over failures of ' +
          'max(0, RL_held \u2212 TCP_after). Same basis as job-runs saved (~1s gate jobs).';
        if (summary.minutes_saved != null && summary.minutes_saved > 0) {
          tipExtra += ' (\u2248 ' + formatMinutesSaved(summary.minutes_saved) +
            ' min at ~' +
            (summary.avg_gate_job_duration_sec || 1) + 's/job)';
        }
        var card;
        card = panel.querySelector('.zuul-rl-hl-submitted');
        if (card) {
          card.title =
            'Total changes submitted this demo session (demo traffic).';
        }
        card = panel.querySelector('.zuul-rl-hl-merged');
        if (card) {
          card.title = 'Successful gate merges this session.';
        }
        card = panel.querySelector('.zuul-rl-hl-fail');
        if (card) {
          card.title =
            'Failed (gate) / in conflict: stamped should_fail gate jobs and ' +
            'speculative merge failures (not git merge-conflict machinery). ' +
            'Shown as actual / expected. Feeds extras & job-runs saved.';
        }
        card = panel.querySelector('.zuul-rl-hl-extra');
        if (card) {
          card.title = tipExtra;
        }
        card = panel.querySelector('.zuul-rl-hl-adv');
        if (card) {
          card.title = tipAdv;
        }
        card = panel.querySelector('.zuul-rl-hl-peak');
        if (card) {
          card.title = tipPeak;
        }

        if (metrics.demo_change_count != null &&
            !isNaN(Number(metrics.demo_change_count))) {
          DEMO_CHANGE_COUNT = Math.max(
            0, Math.round(Number(metrics.demo_change_count)));
        }
        if (metrics.demo_batch_size) {
          DEMO_BATCH_SIZE = metrics.demo_batch_size;
        }
        if (metrics.fail_per_batch) {
          DEMO_FAIL_PER_BATCH = metrics.fail_per_batch;
        }
      }

      function renderComparisonTable(container, metrics) {
        if (!container) {
          return;
        }
        var cmp = metrics && metrics.comparison;
        var phase = metrics && metrics.demo_phase;
        var summary = getSessionSummary(metrics);
        var show = (phase === 'done' || (cmp && metrics.failures &&
          metrics.failures.length > 0)) && !demoRunning;

        Promise.all([
          fetch(CONTROL_BASE + '/live-metrics', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; }),
          fetch(CONTROL_BASE + '/status', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; }),
          fetch(CONTROL_BASE + '/demo-progress', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; })
        ]).then(function (results) {
          var metrics = results[0];
          var st = results[1];
          var prog = results[2];
          applyDemoInputDefaults(panel, metrics, st);

      function triggerDemo() {
        var panel = ensureReportPanel();
        var btn = panel.querySelector('#zuul-rl-run-btn');
        var totalInput = panel.querySelector('#zuul-rl-total-changes');
        var failsInput = panel.querySelector('#zuul-rl-gate-failures');
        var body = {};
        var totalVal = totalInput && totalInput.value !== '' ?
          Number(totalInput.value) : null;
        var failsVal = failsInput && failsInput.value !== '' ?
          Number(failsInput.value) : null;
        if (totalVal != null && (!isFinite(totalVal) || totalVal < 0)) {
          var statusBad = panel.querySelector('#zuul-rl-status');
          if (statusBad) {
            statusBad.textContent = 'Changes must be a number \u2265 0.';
            statusBad.className = 'zuul-rl-status-line zuul-rl-status-error';
          }
          return;
        }
        if (failsVal != null && (!isFinite(failsVal) || failsVal < 0)) {
          var statusBad2 = panel.querySelector('#zuul-rl-status');
          if (statusBad2) {
            statusBad2.textContent = 'Fails must be a number \u2265 0 (gate job failures).';
            statusBad2.className = 'zuul-rl-status-line zuul-rl-status-error';
          }
          return;
        }
        if (totalVal != null && failsVal != null && failsVal > totalVal) {
          var statusBad3 = panel.querySelector('#zuul-rl-status');
          if (statusBad3) {
            statusBad3.textContent = 'Fails must be \u2264 Changes.';
            statusBad3.className = 'zuul-rl-status-line zuul-rl-status-error';
          }
          return;
        }
        if (totalVal != null) {
          body.total_changes = Math.floor(totalVal);
        }
        if (failsVal != null) {
          body.gate_failures = Math.floor(failsVal);
        }
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'Starting...';
        }
        resetChartsToBaseline();
        startDemoPolling();
        renderDemoProgress({
          phase: 'starting',
          message: 'Sending run-demo request\u2026',
          percent: 1
        });
        fetch(CONTROL_BASE + '/run-demo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        })
          .then(function (resp) {
            if (!resp.ok) {
              return resp.json().then(function (err) {
                throw new Error((err && err.message) || 'run-demo failed');
              }).catch(function (e) {
                if (e && e.message && e.message !== 'run-demo failed') {
                  throw e;
                }
                throw new Error('run-demo failed');
              });
            }
            return resp.json();
          })
          .then(function (data) {
            if (data.expected_failures != null &&
                !isNaN(Number(data.expected_failures))) {
              DEMO_EXPECTED_FAILURES = Math.max(
                0, Math.round(Number(data.expected_failures)));
            }
            if (data.total_changes != null &&
                !isNaN(Number(data.total_changes))) {
              DEMO_CHANGE_COUNT = Math.max(
                0, Math.round(Number(data.total_changes)));
            }
            var failCard = panel.querySelector('#zuul-rl-hl-failures');
            if (failCard) {
              failCard.textContent = '0/' + DEMO_EXPECTED_FAILURES;
            }
            renderDemoProgress({
              phase: data.phase || 'starting',
              message: data.message || 'Demo started',
              percent: 2,
              extend_available: true,
              expected_failures: DEMO_EXPECTED_FAILURES,
              total_changes: data.total_changes
            });
            refreshAllParallel();
          })
          .catch(function (err) {
            stopDemoPolling();
            if (btn) {
              btn.disabled = false;
              btn.textContent = 'Run demo';
            }
            var status = panel.querySelector('#zuul-rl-status');
            if (status) {
              status.textContent = (err && err.message) ?
                err.message :
                'Failed to start demo \u2014 is rl-control running?';
              status.className = 'zuul-rl-status-line zuul-rl-status-error';
            }
          });
      }

      function drawLineChart(canvas, series, options) {
        if (!canvas || !series || !series.length) {
          return;
        }
        var ctx = canvas.getContext('2d');
        if (!ctx) {
          return;
        }
        var w = canvas.width;
        var h = canvas.height;
        var pad = { top: 12, right: 10, bottom: 22, left: 32 };
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#fafafa';
        ctx.fillRect(0, 0, w, h);

        var allY = [];
        series.forEach(function (s) {
          (s.values || []).forEach(function (v) {
            if (v != null && !isNaN(v)) {
              allY.push(v);
            }
          });
        });
        var primaryVals = (series[0] && series[0].values) || [];
        var n = primaryVals.length;
        if (!allY.length || n === 0) {
          ctx.fillStyle = '#6a6e73';
          ctx.font = '11px sans-serif';
          ctx.fillText('Waiting for agent ticks\u2026', pad.left, h / 2);
          return;
        }

        var minY = Math.min.apply(null, allY);
        var maxY = Math.max.apply(null, allY);
        if (options && options.ylabel &&
            options.ylabel.indexOf('window') === 0) {
          minY = Math.max(1, minY - 1);
          maxY = Math.min(50, maxY + 1);
          if (maxY - minY < 4) {
            var mid = (minY + maxY) / 2;
            minY = Math.max(1, mid - 2);
            maxY = Math.min(50, mid + 2);
          }
        } else if (minY === maxY) {
          minY -= 1;
          maxY += 1;
        }
        var plotW = w - pad.left - pad.right;
        var plotH = h - pad.top - pad.bottom;
        var xAt = function (i) {
          return pad.left + (n <= 1 ? plotW / 2 : (i / (n - 1)) * plotW);
        };
        var yAt = function (v) {
          return pad.top + plotH - ((v - minY) / (maxY - minY)) * plotH;
        };

        ctx.strokeStyle = '#d2d2d2';
        ctx.lineWidth = 1;
        for (var g = 0; g <= 3; g++) {
          var gy = pad.top + (g / 3) * plotH;
          ctx.beginPath();
          ctx.moveTo(pad.left, gy);
          ctx.lineTo(w - pad.right, gy);
          ctx.stroke();
        }

        ctx.fillStyle = '#6a6e73';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(Math.round(maxY), pad.left - 4, pad.top + 4);
        ctx.fillText(Math.round(minY), pad.left - 4, pad.top + plotH);

        if (options && options.timestamps && options.timestamps.length) {
          ctx.textAlign = 'center';
          var t0 = options.timestamps[0];
          var tN = options.timestamps[options.timestamps.length - 1];
          ctx.fillText(formatTime(t0), pad.left, h - 6);
          ctx.fillText(formatTime(tN), w - pad.right, h - 6);
        }

        if (options && options.failures && options.timestamps) {
          options.failures.forEach(function (fail) {
            var idx = 0;
            var best = Infinity;
            for (var fi = 0; fi < options.timestamps.length; fi++) {
              var d = Math.abs(options.timestamps[fi] - fail.timestamp);
              if (d < best) {
                best = d;
                idx = fi;
              }
            }
            var fx = xAt(idx);
            ctx.strokeStyle = '#c9190b';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(fx, pad.top);
            ctx.lineTo(fx, pad.top + plotH);
            ctx.stroke();
            ctx.setLineDash([]);
            if (fail.session_index != null) {
              ctx.fillStyle = '#c9190b';
              ctx.font = 'bold 9px sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText('#' + fail.session_index, fx, pad.top + 10);
            }
            if (options.showChangeIds && fail.change) {
              var cid = String(fail.change);
              // Prefer bare change number when "project N,ps"
              var m = cid.match(/(\d+)(?:,\d+)?$/);
              var shortId = m ? m[1] : cid.slice(0, 8);
              ctx.fillStyle = '#a30000';
              ctx.font = '8px sans-serif';
              ctx.fillText(shortId, fx, pad.top + plotH - 2);
            }
          });
        }

        series.forEach(function (s) {
          ctx.strokeStyle = s.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          var started = false;
          for (var i = 0; i < s.values.length; i++) {
            var v = s.values[i];
            if (v == null || isNaN(v)) {
              started = false;
              continue;
            }
            var x = xAt(i);
            var y = yAt(v);
            if (!started) {
              ctx.moveTo(x, y);
              started = true;
            } else {
              ctx.lineTo(x, y);
            }
          }
          ctx.stroke();
        });

        // Per-failure annotation: amber down-arrow where TCP dropped,
        // blue dot where RL held — makes the divergence story explicit.
        if (options && options.annotateWindows && options.failures &&
            options.timestamps && series.length >= 2) {
          options.failures.forEach(function (fail) {
            var idx = 0;
            var best = Infinity;
            for (var fi = 0; fi < options.timestamps.length; fi++) {
              var d = Math.abs(options.timestamps[fi] - fail.timestamp);
              if (d < best) {
                best = d;
                idx = fi;
              }
            }
            var fx = xAt(idx);
            var rlV = series[0].values[idx];
            var tcpV = series[1].values[idx];
            if (tcpV != null && !isNaN(tcpV)) {
              var ty = yAt(tcpV);
              ctx.fillStyle = '#c46100';
              ctx.beginPath();
              ctx.moveTo(fx - 4, ty - 7);
              ctx.lineTo(fx + 4, ty - 7);
              ctx.lineTo(fx, ty - 1);
              ctx.closePath();
              ctx.fill();
            }
            if (rlV != null && !isNaN(rlV)) {
              var ry = yAt(rlV);
              ctx.fillStyle = '#06c';
              ctx.beginPath();
              ctx.arc(fx, ry, 2.6, 0, Math.PI * 2);
              ctx.fill();
            }
          });
        }

        if (options && options.ylabel) {
          ctx.save();
          ctx.translate(10, pad.top + plotH / 2);
          ctx.rotate(-Math.PI / 2);
          ctx.fillStyle = '#6a6e73';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(options.ylabel, 0, 0);
          ctx.restore();
        }
      }

      function drawExtraBarChart(canvas, failures) {
        if (!canvas) {
          return;
        }
        var ctx = canvas.getContext('2d');
        if (!ctx) {
          return;
        }
        var w = canvas.width;
        var h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#fafafa';
        ctx.fillRect(0, 0, w, h);
        var pad = { top: 14, right: 8, bottom: 22, left: 28 };
        if (!failures || !failures.length) {
          ctx.fillStyle = '#6a6e73';
          ctx.font = '11px sans-serif';
          ctx.fillText('Extra slots appear at each gate failure\u2026', pad.left, h / 2);
          return;
        }
        var vals = failures.map(function (f) {
          var v = f.extra_changes != null ? f.extra_changes :
            (f.changes_in_window_delta != null ? f.changes_in_window_delta : 0);
          v = Number(v);
          return isNaN(v) ? 0 : v;
        });
        var maxY = Math.max(1, Math.max.apply(null, vals));
        var plotW = w - pad.left - pad.right;
        var plotH = h - pad.top - pad.bottom;
        var barW = Math.max(8, (plotW / vals.length) * 0.6);
        ctx.fillStyle = '#6a6e73';
        ctx.font = '9px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(String(maxY), pad.left - 4, pad.top + 4);
        ctx.fillText('0', pad.left - 4, pad.top + plotH);
        vals.forEach(function (v, i) {
          var x = pad.left + ((i + 0.5) / vals.length) * plotW - barW / 2;
          var bh = (v / maxY) * plotH;
          var y = pad.top + plotH - bh;
          ctx.fillStyle = v > 0 ? '#06c' : '#d2d2d2';
          ctx.fillRect(x, y, barW, Math.max(bh, v > 0 ? 2 : 0));
          ctx.fillStyle = '#151515';
          ctx.font = '9px sans-serif';
          ctx.textAlign = 'center';
          var label = failures[i].change ?
            String(failures[i].change).replace(/^.*\s/, '').split(',')[0] :
            '#' + (failures[i].session_index || (i + 1));
          ctx.fillText(label, x + barW / 2, h - 6);
          if (v > 0) {
            ctx.fillStyle = '#06c';
            ctx.font = 'bold 9px sans-serif';
            ctx.fillText('+' + v, x + barW / 2, y - 2);
          }
        });
      }

      function renderFailures(container, failures, failureCounts, metrics) {
        if (!container) {
          return;
        }
        if (!failures || !failures.length) {
          container.innerHTML = '';
          return;
        }
        var html = '<strong>Recent failures</strong>';
        failures.slice().reverse().forEach(function (f) {
          var tip = '';
          if (f.extra_changes != null) {
            tip = ' title="Extra changes at this failure: ' + f.extra_changes +
              ' (RL ' + (f.rl_window != null ? f.rl_window : '?') +
              ' − TCP ' +
              (f.tcp_window_after != null ? f.tcp_window_after :
                (f.tcp_window != null ? f.tcp_window : '?')) + ')"';
          }
          if (f.impact_text) {
            html += '<div class="zuul-rl-failure-row"' + tip + '>' +
              f.impact_text + '</div>';
            return;
          }
          var rl = f.rl_window != null ? f.rl_window : '?';
          var change = f.change || 'unknown';
          var extra = f.extra_changes != null ? f.extra_changes : 0;
          if (f.tcp_window_before != null && f.tcp_window_after != null) {
            html += '<div class="zuul-rl-failure-row"' + tip + '>Change ' +
              change + ' failed → TCP shrunk ' + f.tcp_window_before + '→' +
              f.tcp_window_after + '; RL held ' + rl +
              (extra > 0 ? ' (+' + extra + ' extra)' : '') + '</div>';
          } else {
            html += '<div class="zuul-rl-failure-row"' + tip + '>Change ' +
              change + ' failed → RL ' + rl + ' / TCP ' +
              (f.tcp_window != null ? f.tcp_window : '?') + '</div>';
          }
        });
        container.innerHTML = html;
      }

      function updateLiveMetrics() {
        if (!window.location.pathname.includes('/status')) {
          var existing = document.getElementById(PANEL_ID);
          if (existing) {
            existing.style.display = 'none';
          }
          return;
        }
        if (metricsInFlight) {
          return;
        }
        metricsInFlight = true;
        var panel = ensureReportPanel();
        fetch(CONTROL_BASE + '/live-metrics', { cache: 'no-store' })
          .then(function (resp) {
            if (!resp.ok) {
              throw new Error('live metrics unavailable');
            }
            return resp.json();
          })
          .then(function (metrics) {
            liveMetricsFailStreak = 0;
            lastMetrics = metrics;
            panel.style.display = 'block';
            scheduleChartDraw(metrics, panel);
          })
          .catch(function () {
            liveMetricsFailStreak += 1;
            var panel = document.getElementById(PANEL_ID);
            if (panel) {
              panel.style.display = 'block';
              var status = panel.querySelector('#zuul-rl-status');
              if (status &&
                  liveMetricsFailStreak >= CONN_LOST_AFTER_FAILURES) {
                status.textContent = demoRunning ?
                  'Connection lost \u2014 retrying\u2026 charts show last ' +
                  'known values.' :
                  'Live monitor offline \u2014 start rl-control on port 19100.';
                status.className = 'zuul-rl-status-line zuul-rl-status-error';
              }
            }
          })
          .finally(function () {
            metricsInFlight = false;
          });
      }

      function updateReportPanel() {
        if (!window.location.pathname.includes('/status')) {
          return;
        }
        var panel = ensureReportPanel();
        fetch(CONTROL_BASE + '/status', { cache: 'no-store' })
          .then(function (resp) {
            if (!resp.ok) {
              throw new Error('control service unavailable');
            }
            return resp.json();
          })
          .then(function (st) {
            var link = panel.querySelector('#zuul-rl-report-link');
            var status = panel.querySelector('#zuul-rl-status');
            var btn = panel.querySelector('#zuul-rl-run-btn');
            if (btn) {
              btn.disabled = !!st.running;
              btn.textContent = st.running ? 'Running...' : 'Run demo';
            }
            if (status) {
              status.className = 'zuul-rl-status-line';
              if (st.running || demoRunning) {
                if (!demoRunning) {
                  startDemoPolling();
                }
                if (st.demo_progress) {
                  renderDemoProgress(st.demo_progress);
                }
                if (!lastMetrics || !demoRunning) {
                  status.textContent =
                    'Demo scenario running \u2014 see progress above.';
                  status.className += ' zuul-rl-status-running';
                }
              } else if (st.last_error) {
                status.textContent = 'Last demo run failed: ' + st.last_error;
                status.className += ' zuul-rl-status-error';
              } else if (st.latest && st.latest.rl_window != null) {
                status.textContent =
                  'Live — session & live metrics below.';
                status.className += ' zuul-rl-status-live';
              } else if (st.latest_run) {
                status.textContent =
                  'Idle \u2014 latest report ' + st.latest_run +
                  ' (graphs still refresh from live audit data).';
              } else {
                status.textContent =
                  'Live \u2014 waiting for RL agent ticks and gate traffic.';
                status.className += ' zuul-rl-status-live';
              }
            }
            if (link && st.latest_run) {
              link.href = REPORT_BASE + '/report.html?v=' + st.latest_run;
            }
            panel.style.display = 'block';
          })
          .catch(function () {});
      }

      function render(data) {
        if (!window.location.pathname.includes('/status')) {
          var existing = document.getElementById(BANNER_ID);
          if (existing) {
            existing.style.display = 'none';
          }
          return;
        }

        var banner = ensureBanner();
        placeBanner(banner);

        if (demoRunning) {
          banner.style.display = 'block';
          banner.innerHTML =
            '<span class="zuul-rl-banner-title">RL demo in progress</span> ' +
            '<span class="zuul-rl-mode">Watch the progress panel (bottom-right): ' +
            'clearing queues \u2192 check \u2192 Verified+1 \u2192 gate \u2192 processing. ' +
            'Gate cards show one <strong>RL</strong> + one <strong>TCP</strong> summary each.</span>';
          return;
        }

        var parts = [];
        (data.pipelines || []).forEach(function (pipeline) {
          var rl = pipeline.rl_window;
          if (!rl || !rl.queues || !rl.queues.length) {
            return;
          }
          var q = rl.queues[0];
          var rlWin = q.current_window != null ? q.current_window : '?';
          var tcpWin = q.tcp_shadow_window != null ? q.tcp_shadow_window : '?';
          parts.push('<strong>' + pipeline.name + '</strong> ' +
            '<span class="zuul-rl-active">RL ' + rlWin + '</span> ' +
            '<span class="zuul-rl-tcp">TCP ' + tcpWin + '</span>');
        });

        if (!parts.length) {
          banner.style.display = 'none';
          return;
        }
        banner.style.display = 'block';
        var gate = (data.pipelines || []).find(function (p) {
          return p.name === 'gate';
        });
        var mode = gate && gate.rl_window ? gate.rl_window.mode : 'active';
        var modeLine = mode === 'shadow' ?
          'Shadow mode — TCP baseline still governs Zuul.' :
          'Active mode — RL window applied to gate.';
        banner.innerHTML =
          '<span class="zuul-rl-banner-title">' +
          'RL vs Traditional TCP Window — Live Comparison</span> ' +
          '<span class="zuul-rl-mode">' + modeLine +
          ' Blue = RL (applied). Amber = TCP shadow baseline.</span> &nbsp;|&nbsp; ' +
          parts.join(' &nbsp;|&nbsp; ');
      }

      function removeStrayQueueBadges() {
        document.querySelectorAll('.zuul-rl-queue-badge').forEach(function (badge) {
          if (!badge.closest('.zuul-pipeline-summary')) {
            badge.remove();
          }
        });
      }

      function enhanceBadges(data) {
        removeStrayQueueBadges();
        (data.pipelines || []).forEach(function (pipeline) {
          var rl = pipeline.rl_window;
          if (!rl || !rl.queues || !rl.queues.length) {
            return;
          }
          var q = rl.queues[0];
          var rlWin = q.current_window != null ? q.current_window : '?';
          var tcpWin = q.tcp_shadow_window != null ? q.tcp_shadow_window : '?';

          document.querySelectorAll('.zuul-pipeline-summary').forEach(function (card) {
            var link = card.querySelector('a.zuul-pipeline-link');
            if (!link || link.textContent.trim() !== pipeline.name) {
              return;
            }
            var rlTag = card.querySelector('.zuul-rl-queue-badge.zuul-rl-badge-active');
            if (!rlTag) {
              rlTag = document.createElement('span');
              rlTag.className = 'zuul-rl-queue-badge zuul-rl-badge-active';
              link.insertAdjacentElement('afterend', rlTag);
            }
            rlTag.textContent = 'RL ' + rlWin;

            var tcpTag = card.querySelector('.zuul-rl-queue-badge.zuul-rl-badge-tcp');
            if (!tcpTag) {
              tcpTag = document.createElement('span');
              tcpTag.className = 'zuul-rl-queue-badge zuul-rl-badge-tcp';
              rlTag.insertAdjacentElement('afterend', tcpTag);
            }
            tcpTag.textContent = 'TCP ' + tcpWin;
          });
        });
      }

      function scheduleBadgeEnhance(data) {
        if (badgeEnhanceTimer) {
          clearTimeout(badgeEnhanceTimer);
        }
        badgeEnhanceTimer = setTimeout(function () {
          badgeEnhanceTimer = null;
          enhanceBadges(data);
        }, 300);
      }

      function nudgeZuulGridRefresh() {
        if (!window.location.pathname.includes('/status')) {
          return;
        }
        var btn = document.querySelector('.zuul-reload-button button');
        if (btn && !btn.disabled) {
          btn.click();
        }
      }

      function scheduleStatusPollInterval() {
        if (statusPollTimer) {
          clearInterval(statusPollTimer);
        }
        var ms = demoRunning ? STATUS_POLL_DEMO_MS : STATUS_POLL_MS;
        statusPollTimer = setInterval(pollStatus, ms);
      }

      function pollStatus() {
        if (!window.location.pathname.includes('/status')) {
          return;
        }
        var tenant = tenantFromPath();
        fetch('/api/tenant/' + tenant + '/status')
          .then(function (r) { return r.json(); })
          .then(function (data) {
            lastStatusData = data;
            render(data);
            scheduleBadgeEnhance(data);
          })
          .catch(function () {});
      }

      function startLiveMonitoring() {
        refreshAllParallel();
        pollStatus();
        scheduleStatusPollInterval();
        scheduleGridRefresh();
      }

      setInterval(updateLiveMetrics, LIVE_POLL_MS);
      setInterval(updateReportPanel, LIVE_POLL_MS * 2);
      startLiveMonitoring();

      var root = document.getElementById('root');
      if (root) {
        var moTimer = null;
        new MutationObserver(function () {
          if (!window.location.pathname.includes('/status') || !lastStatusData) {
            return;
          }
          clearTimeout(moTimer);
          moTimer = setTimeout(function () {
            scheduleBadgeEnhance(lastStatusData);
          }, 600);
        }).observe(root, {
          childList: true,
          subtree: true,
        });
      }
    })();
    </script>

    <!-- zuul-rl-overlay-begin -->
    <style id="zuul-rl-window-style">
      #zuul-rl-window-banner {
        background: #004368;
        color: #fff;

        font-size: 14px;

        border-radius: 6px;

        display: none;

      #zuul-rl-report-panel.zuul-rl-minimized {
        height: auto;
        width: auto;
        min-width: 180px;

      #zuul-rl-report-panel.zuul-rl-minimized #zuul-rl-report-body,
      #zuul-rl-report-panel.zuul-rl-minimized #zuul-rl-run-btn,
      #zuul-rl-report-panel.zuul-rl-minimized #zuul-rl-stop-btn,

        display: none;
      }
      #zuul-rl-report-panel .header {
        background: #151515;
        color: #fff;
        font-size: 12px;
        padding: 6px 10px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;

      #zuul-rl-report-panel .header-title {

        overflow: hidden;
        text-overflow: ellipsis;

        font-size: 11px;

      #zuul-rl-minimize-btn {

        font-size: 14px;
        line-height: 1;

      #zuul-rl-minimize-btn:hover {
        background: #393f44;
      }
      #zuul-rl-report-body {
        padding: 8px 10px;
        height: calc(100% - 35px);
        overflow: auto;
      }
      #zuul-rl-run-btn {
        background: #06c;
        color: #fff;
        border: 0;
        border-radius: 3px;
        padding: 3px 8px;
        cursor: pointer;
        font-size: 12px;
        margin-right: 8px;
      }
      #zuul-rl-run-btn[disabled] {
        background: #6a6e73;
        cursor: default;
      }
      #zuul-rl-stop-btn {
        background: #c9190b;
        color: #fff;
        border: 0;
        border-radius: 3px;
        padding: 3px 8px;
        cursor: pointer;
        font-size: 12px;
        margin-right: 8px;
      }
      #zuul-rl-stop-btn[disabled] {
        background: #6a6e73;
        cursor: default;
      }

        display: block;

        color: #393f44;
        margin-bottom: 4px;
        line-height: 1.35;
      }
      #zuul-rl-demo-batch-tip {
        font-size: 10px;
        color: #6a6e73;
        margin-bottom: 6px;
        line-height: 1.35;
      }
      #zuul-rl-demo-bar-wrap {
        height: 8px;
        background: #d2d2d2;
        border-radius: 4px;
        overflow: hidden;

      #zuul-rl-demo-bar {

        border-radius: 4px;
        transition: width 0.4s ease;

      #zuul-rl-demo-bar.zuul-rl-demo-indeterminate {

        animation: zuul-rl-demo-pulse 1.2s ease-in-out infinite;

      @keyframes zuul-rl-demo-pulse {
        0% { margin-left: 0%; }
        50% { margin-left: 60%; }

        margin-bottom: 8px;
        line-height: 1.4;
      }

        color: #06c;
      }
      .zuul-rl-status-line.zuul-rl-status-error {
        color: #c9190b;
      }
      .zuul-rl-status-line.zuul-rl-status-live {
        color: #3e8635;
      }
      .zuul-rl-failures {

        line-height: 1.35;
      }
      .zuul-rl-failure-impact {
        font-size: 10px;
        color: #393f44;
        margin-top: 2px;
      }
      .zuul-rl-impact-summary {
        font-size: 11px;
        color: #151515;
        margin-top: 6px;
        line-height: 1.4;
        padding: 6px 8px;
        background: #fff;
        border-radius: 3px;
        border: 1px solid #b8d4b8;

      .zuul-rl-failures:empty {
        display: none;
      }
      .zuul-rl-failures strong {
        display: block;
        margin-bottom: 4px;
        color: #a30000;
      }
      .zuul-rl-chart-wrap {
        margin-bottom: 8px;
      }
      .zuul-rl-chart-title {
        font-size: 11px;
        font-weight: 600;
        color: #151515;
        margin-bottom: 2px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 6px;
      }
      .zuul-rl-enlarge-btn {
        background: transparent;
        color: #4b4b4b;
        border: 1px solid #b8b8b8;
        border-radius: 3px;
        width: 20px;
        height: 18px;
        line-height: 1;
        padding: 0;
        cursor: pointer;
        font-size: 12px;
        flex-shrink: 0;

      .zuul-rl-enlarge-btn:hover {
        background: #e2e2e2;
      }
      .zuul-rl-explain-btn {
        background: transparent;
        color: #06c;
        border: 1px solid #b8d6f0;
        border-radius: 3px;
        padding: 1px 6px;
        cursor: pointer;
        font-size: 10px;
        margin: 3px 0 2px;
      }
      .zuul-rl-explain-btn:hover {
        background: #eaf3fc;

        background: #f4f8fc;
        border: 1px solid #d3e3f2;
        border-radius: 3px;
        padding: 6px 8px;
        margin: 2px 0 6px;
      }
      .zuul-rl-chart {
        width: 100%;
        height: 170px;
        border: 1px solid #d2d2d2;
        border-radius: 3px;
        display: block;
        background: #fafafa;
      }
      .zuul-rl-legend {
        font-size: 10px;
        color: #6a6e73;
        margin-top: 2px;
      }
      .zuul-rl-chart-stats {

        color: #151515;

        font-weight: 600;
      }
      .zuul-rl-chart-stats .rl-stat b {

      }
      .zuul-rl-legend span {

      .zuul-rl-efficiency-block {

        margin-bottom: 4px;

        height: 56px;
        display: block;
        background: #fff;
        border-radius: 3px;

      }
      .zuul-rl-highlight-card.zuul-rl-hl-win {
        background: #e7f6e7;
        border-color: #3e8635;
      }
      .zuul-rl-hl-label {
        font-size: 9px;

      .zuul-rl-tip {
        cursor: help;
      }
      .zuul-rl-hl-label {
        border-bottom: 1px dotted #8a8d90;
      }
      .zuul-rl-chart-axis {

        color: #6a6e73;
        margin-top: 1px;

      .zuul-rl-compare-block {

        background: #e7f1fa;

      }
      .zuul-rl-compare-block td.zuul-rl-benefit {

      .zuul-rl-compare-summary {
        margin-top: 6px;
        font-size: 11px;
        line-height: 1.4;
        color: #151515;

        border: 1px solid #b8d4b8;
      }
      #zuul-rl-extra-chart {
        width: 100%;

        display: block;
        background: #fafafa;
        border: 1px solid #d2d2d2;

      }
      #zuul-rl-live-line {
        font-size: 12px;
        line-height: 1.45;
        padding: 6px 8px;
        background: #f5f5f5;

      #zuul-rl-live-line .zuul-rl-live-rl { color: #06c; font-weight: 700; }
      #zuul-rl-live-line .zuul-rl-live-tcp { color: #c46100; font-weight: 700; }
      #zuul-rl-done-banner {
        display: none;
        margin-bottom: 6px;

        font-weight: 600;
        color: #1e4f18;
      }
      #zuul-rl-demo-warning {
        display: none;
        margin-top: 5px;
        padding: 4px 8px;
        background: #fdf7e7;
        border: 1px solid #f0ab00;
        border-radius: 3px;
        font-size: 11px;
        color: #795600;
        line-height: 1.35;
      }
      /* --- Section framing: labeled, scannable blocks --- */

        margin-bottom: 10px;
        border: 1px solid #d2d2d2;
        border-radius: 5px;
        background: #fff;
        overflow: hidden;

        display: inline-block;

        color: #004368;

        font-size: 10px;
        color: #6a6e73;

        color: #3e8635;

            }
            var key = box.id.replace('zuul-rl-explain-', '');
            var def = CHART_DEFS[key];
            if (def && def.explain) {
              box.innerHTML = def.explain(metrics);
            }
          });
      }

      var badgeEnhanceTimer = null;
      var statusPollTimer = null;
      var gridRefreshTimer = null;
      // Connection / staleness watchdog state. Staleness is measured as
      // local time since the server-side progress stamp last CHANGED —
      // never by comparing server clocks to the browser clock (container
      // clocks can drift hours from the host under Docker Desktop).
      var liveMetricsFailStreak = 0;
      var demoProgressFailStreak = 0;
      var lastSeenProgressStamp = 0;
      var lastProgressChangeLocalMs = 0;
      var STALE_PROGRESS_WARN_SEC = 30;
      var CONN_LOST_AFTER_FAILURES = 2;

      var DEMO_PHASE_LABELS = {
        starting: 'Starting the demo',
        waiting_audit: 'Waiting for the RL agent',
        resetting_windows: 'Resetting both windows to 8',
        clearing_queues: 'Clearing the pipeline',
        submitting_traffic: 'Sending changes through the gate',
        waiting_gate_cycles: 'Waiting for jobs to finish',
        generating_report: 'Writing the comparison',
        publishing: 'Publishing the report',
        stopping: 'Stopping the demo',
        cancelled: 'Demo stopped',
        done: 'Demo complete',
        error: 'Demo failed'
      };

      function formatMmSs(sec) {
        sec = Math.max(0, Math.floor(sec || 0));
        var m = Math.floor(sec / 60);
        var s = sec % 60;
        return m + ':' + (s < 10 ? '0' : '') + s;
      }

      function formatFailCount(x) {
        return String(x);
      }

      function targetFailsFromInputs(panel) {
        if (!panel) {
          panel = document.getElementById(PANEL_ID);
        }
        if (!panel) {
          return DEMO_EXPECTED_FAILURES;
        }
        var inp = panel.querySelector('#zuul-rl-gate-failures');
        var n = inp ? numOrNull(inp.value) : null;
        if (n == null) {
          return DEMO_EXPECTED_FAILURES;
        }
        return Math.max(0, Math.round(n));
      }

      function setFailCard(panel, x, y) {
        if (!panel) {
          return;
        }
        var el = panel.querySelector('#zuul-rl-hl-failures');
        if (el) {
          el.textContent = formatFailCount(x, y);
        }
      }

      function shortenDecisionReason(reason) {
        var s = String(reason || '').trim();
        if (!s) {
          return '';
        }
        s = s.replace(/\s*Only \d+ executors free\.?/gi, '').trim();
        var first = s.split(/\.\s+/)[0].replace(/\s+$/, '');
        if (first && !/[.!?]$/.test(first)) {
          first += '.';
        }
        if (first.length > 110) {
          first = first.slice(0, 107) + '\u2026';
        }
        return first;
      }

      function buildAfterRunStory(summary, expectedN) {
        var tcpFloor = numOrNull(summary && summary.tcp_after_floor);
        var rlPeak = numOrNull(summary && summary.rl_held_peak);
        var extras = (summary && summary.extra_changes_total) || 0;
        var failN = (summary && summary.gate_failures) || 0;
        var s1;
        if (tcpFloor != null) {
          s1 = 'Traditional TCP shrank the gate window as low as ' +
            Math.round(tcpFloor) + ' after jobs failed.';
        } else {
          s1 = 'Traditional TCP shrinks the gate window after each failed job.';
        }
        var s2;
        if (rlPeak != null && tcpFloor != null && rlPeak > tcpFloor) {
          s2 = 'RL held or grew the window (up to ' + Math.round(rlPeak) +
            '), so more changes kept testing in parallel.';
        } else if (rlPeak != null) {
          s2 = 'RL stayed near window ' + Math.round(rlPeak) +
            ', in step with TCP.';
        } else {
          s2 = 'RL kept the window at least as open as TCP.';
        }
        var s3 = extras > 0 ?
          'Those extra parallel slots are Extra vs TCP (' + extras +
            ') in This session.' :
          'This run did not accumulate extra slots vs TCP.';
        var s4 = 'Gate failures totaled ' + failN + ' this session.';
        return s1 + ' ' + s2 + ' ' + s3 + ' ' + s4;
      }

      function renderDemoWarning(panel, text) {
        var warn = panel.querySelector('#zuul-rl-demo-warning');
        if (!warn) {
          return;
        }
        if (text) {
          warn.textContent = '\u26a0 ' + text;
          warn.style.display = 'block';
        } else {
          warn.style.display = 'none';
          warn.textContent = '';
        }
      }

      function checkProgressStaleness(prog) {
        // Watchdog: warn when the demo worker stops publishing progress.
        var panel = document.getElementById(PANEL_ID);
        if (!panel) {
          return;
        }
        if (!demoRunning || !prog) {
          lastSeenProgressStamp = 0;
          lastProgressChangeLocalMs = 0;
          renderDemoWarning(panel, null);
          return;
        }
        var stamp = prog.progress_updated_at || 0;
        if (stamp !== lastSeenProgressStamp) {
          lastSeenProgressStamp = stamp;
          lastProgressChangeLocalMs = Date.now();
        }
        if (!lastProgressChangeLocalMs) {
          lastProgressChangeLocalMs = Date.now();
        }
        var staleFor = (Date.now() - lastProgressChangeLocalMs) / 1000;
        if (staleFor > STALE_PROGRESS_WARN_SEC) {
          renderDemoWarning(panel,
            'No progress update for ' + Math.round(staleFor) +
            's — demo worker may be stuck (phase: ' +
            (prog.phase || 'unknown') + ').');
        } else {
          renderDemoWarning(panel, null);
        }
      }

      function renderDemoProgress(prog) {
        var panel = document.getElementById(PANEL_ID);
        if (!panel) {
          return;
        }
        var block = panel.querySelector('#zuul-rl-demo-progress');
        var phaseEl = panel.querySelector('#zuul-rl-demo-phase');
        var detailEl = panel.querySelector('#zuul-rl-demo-detail');
        var bar = panel.querySelector('#zuul-rl-demo-bar');
        if (!block || !phaseEl || !detailEl || !bar) {
          return;
        }
        if (!prog || !demoRunning) {
          block.classList.remove('zuul-rl-demo-active');
          bar.classList.remove('zuul-rl-demo-indeterminate');
          bar.style.width = '0%';
          renderDemoWarning(panel, null);
          setDemoInputsDisabled(panel, false);
          syncDemoControlButtons(panel, prog, false);
          return;
        }
        block.classList.add('zuul-rl-demo-active');
        setDemoInputsDisabled(panel, true);
        if (prog.expected_failures != null &&
            !isNaN(Number(prog.expected_failures))) {
          DEMO_EXPECTED_FAILURES = Math.max(
            0, Math.round(Number(prog.expected_failures)));
        }
        if (prog.total_changes != null &&
            !isNaN(Number(prog.total_changes))) {
          DEMO_CHANGE_COUNT = Math.max(
            0, Math.round(Number(prog.total_changes)));
        }
        var phase = prog.phase || 'starting';
        var label = DEMO_PHASE_LABELS[phase] || phase;
        var pct = prog.percent != null ? prog.percent : 0;
        phaseEl.textContent = label + (pct > 0 && pct < 100 ? ' \u2014 ' + pct + '%' : '');
        var sent = Math.max(0, Math.round(Number(prog.changes_submitted) || 0));
        var totalCh = prog.total_changes != null && !isNaN(Number(prog.total_changes))
          ? Math.max(0, Math.round(Number(prog.total_changes)))
          : DEMO_CHANGE_COUNT;
        var failY = expectedFailuresFrom(lastMetrics, prog);
        var failX = 0;
        if (lastMetrics) {
          failX = getSessionSummary(lastMetrics).gate_failures || 0;
        }
        if (prog.failures_so_far != null &&
            !isNaN(Number(prog.failures_so_far))) {
          failX = Math.max(
            failX, Math.max(0, Math.round(Number(prog.failures_so_far))));
        }
        var sentence = label + '.';
        if (phase === 'submitting_traffic' || prog.traffic_active) {
          sentence = sent + ' of ' + totalCh + ' changes sent. ' +
            failX + ' of ' + failY + ' jobs have failed.';
          // The window reacts to every failed cycle, not just stamped job
          // failures (merge conflicts fail a cycle with no job ever run).
          // Surface that total too whenever it's the bigger number, so
          // "0 job failures" next to a window that has clearly shrunk
          // doesn't look broken.
          var cycleFails = prog.cycle_failures_so_far != null &&
            !isNaN(Number(prog.cycle_failures_so_far)) ?
            Math.max(0, Math.round(Number(prog.cycle_failures_so_far))) : null;
          if (cycleFails != null && cycleFails > failX) {
            sentence += ' (' + cycleFails +
              ' cycle failures so far, incl. merge conflicts.)';
          }
          if (prog.time_remaining_s != null) {
            sentence += ' About ' + formatMmSs(prog.time_remaining_s) + ' left.';
          }
        } else if (phase === 'done') {
          sentence = 'Demo complete. Read After the run below.';
        } else if (phase === 'stopping' || phase === 'cancelled') {
          sentence = (prog.message && String(prog.message)) ||
            'Stopping demo\u2026 clearing queues';
        } else if (phase === 'clearing_queues') {
          sentence = 'Clearing the pipeline so the run starts clean.';
        } else if (phase === 'resetting_windows') {
          sentence = 'Both windows start at 8 so the comparison is fair.';
        } else if (prog.message && phase !== 'starting') {
          sentence = String(prog.message);
        }
        detailEl.textContent = sentence;
        detailEl.removeAttribute('title');
        var batchTipEl = panel.querySelector('#zuul-rl-demo-batch-tip');
        if (batchTipEl) {
          batchTipEl.textContent = '';
          batchTipEl.style.display = 'none';
        }
        setFailCard(panel, failX, failY);
        var submittedCard = panel.querySelector('#zuul-rl-hl-submitted');
        if (submittedCard && prog.changes_submitted != null &&
            !isNaN(Number(prog.changes_submitted))) {
          submittedCard.textContent = String(
            Math.max(0, Math.round(Number(prog.changes_submitted))));
        }
        syncDemoControlButtons(panel, prog, !!demoRunning);
        bar.classList.remove('zuul-rl-demo-indeterminate');
        if (phase === 'stopping') {
          bar.classList.add('zuul-rl-demo-indeterminate');
        } else if (pct > 0 && pct < 100) {
          bar.style.width = pct + '%';
        } else if (phase === 'done') {
          bar.style.width = '100%';
        } else {
          bar.classList.add('zuul-rl-demo-indeterminate');
        }
      }

      function scheduleGridRefresh() {
        if (gridRefreshTimer) {
          clearInterval(gridRefreshTimer);
        }
        gridRefreshTimer = setInterval(
          nudgeZuulGridRefresh,
          demoRunning ? GRID_REFRESH_DEMO_MS : GRID_REFRESH_MS
        );
      }

      function onDemoRunningChanged() {
        scheduleStatusPollInterval();
        scheduleGridRefresh();
        if (lastStatusData) {
          render(lastStatusData);
        }
      }

      function startDemoPolling() {
        demoRunning = true;
        onDemoRunningChanged();
        var panel = document.getElementById(PANEL_ID);
        setDemoInputsDisabled(panel, true);
        if (demoPollTimer) {
          clearInterval(demoPollTimer);
        }
        if (demoLiveMetricsTimer) {
          clearInterval(demoLiveMetricsTimer);
        }
        pollDemoProgress();
        updateLiveMetrics();
        demoPollTimer = setInterval(pollDemoProgress, DEMO_POLL_MS);
        demoLiveMetricsTimer = setInterval(updateLiveMetrics, LIVE_POLL_MS);
      }

      function stopDemoPolling() {
        demoRunning = false;
        if (demoPollTimer) {
          clearInterval(demoPollTimer);
          demoPollTimer = null;
        }
        if (demoLiveMetricsTimer) {
          clearInterval(demoLiveMetricsTimer);
          demoLiveMetricsTimer = null;
        }
        renderDemoProgress(null);
        var panel = document.getElementById(PANEL_ID);
        setDemoInputsDisabled(panel, false);
        onDemoRunningChanged();
      }

      function pollDemoProgress() {
        if (!window.location.pathname.includes('/status')) {
          return;
        }
        var panel = ensureReportPanel();
        fetch(CONTROL_BASE + '/demo-progress', { cache: 'no-store' })
          .then(function (resp) {
            if (!resp.ok) {
              throw new Error('demo progress unavailable');
            }
            return resp.json();
          })
          .then(function (prog) {
            demoProgressFailStreak = 0;
            var running = !!prog.running;
            var stopping = !!(prog.stopping || prog.phase === 'stopping');
            if (demoRunning !== running) {
              demoRunning = running;
              onDemoRunningChanged();
            }
            if (stopping) {
              demoRunning = true;
            }
            syncDemoControlButtons(panel, prog, running || stopping);
            renderDemoProgress(prog);
            checkProgressStaleness(prog);
            var statusEl = panel.querySelector('#zuul-rl-status');
            if (stopping && statusEl) {
              statusEl.textContent = prog.message ||
                'Stopping demo\u2026 clearing queues';
              statusEl.className = 'zuul-rl-status-line zuul-rl-status-running';
            }
            if (!running) {
              if (statusEl && (prog.phase === 'cancelled' ||
                  prog.phase === 'stopping')) {
                statusEl.textContent = prog.message ||
                  'Demo stopped. Click Run demo to start.';
                statusEl.className = 'zuul-rl-status-line';
              }
              stopDemoPolling();
              refreshAllParallel();
              pollStatus();
            }
          })
          .catch(function () {
            demoProgressFailStreak += 1;
            if (demoRunning &&
                demoProgressFailStreak >= CONN_LOST_AFTER_FAILURES) {
              renderDemoWarning(panel,
                'Connection to demo controller lost — retrying\u2026 ' +
                '(values shown may be stale)');
            }
          });
      }

      function scheduleChartDraw(metrics, panel) {
        if (chartDrawPending) {
          return;
        }
        chartDrawPending = true;
        requestAnimationFrame(function () {
          chartDrawPending = false;
          if (!panel || !metrics) {
            return;
          }
          var windowCanvas = panel.querySelector('#zuul-rl-window-chart');
          var throughputCanvas = panel.querySelector('#zuul-rl-throughput-chart');
          var efficiencyCanvas = panel.querySelector('#zuul-rl-efficiency-chart');
          var extraCanvas = panel.querySelector('#zuul-rl-extra-chart');
          var executorCanvas = panel.querySelector('#zuul-rl-executor-chart');
          var failuresEl = panel.querySelector('#zuul-rl-failures');
          var compareEl = panel.querySelector('#zuul-rl-comparison');
          var status = panel.querySelector('#zuul-rl-status');

          CHART_DEFS.window.draw(windowCanvas, metrics);
          CHART_DEFS.throughput.draw(throughputCanvas, metrics);
          CHART_DEFS.efficiency.draw(efficiencyCanvas, metrics);
          CHART_DEFS.extra.draw(extraCanvas, metrics);
          CHART_DEFS.executor.draw(executorCanvas, metrics);
          redrawEnlargedChartIfOpen(metrics);
          refreshOpenChartExplains(panel, metrics);

          renderFailures(
            failuresEl, metrics.failures, metrics.failure_counts, metrics);
          renderSessionSummary(panel, metrics);
          renderLiveLine(panel, metrics);
          renderComparisonTable(compareEl, metrics);
          renderDecisionReason(panel, metrics);

          if (status && metrics.latest && !status.classList.contains('zuul-rl-status-error')) {
            if (demoRunning) {
              status.textContent = '';
              status.className = 'zuul-rl-status-line';
            } else if (metrics.demo_phase === 'done') {
              status.textContent = 'Demo complete \u2014 read After the run.';
              status.className = 'zuul-rl-status-line zuul-rl-status-live';
            } else {
              status.textContent = 'Click Run demo to start.';
              status.className = 'zuul-rl-status-line';
            }
          }
        });
      }

      function renderLiveLine(panel, metrics) {
        var rlEl = panel.querySelector('#zuul-rl-now-rl');
        var tcpEl = panel.querySelector('#zuul-rl-now-tcp');
        var deltaEl = panel.querySelector('#zuul-rl-now-delta');
        var legacy = panel.querySelector('#zuul-rl-live-line');
        var summary = getSessionSummary(metrics);
        var live = summary.live || {};
        var latest = (metrics && metrics.latest) || {};
        var rlWin = live.rl_window != null ? live.rl_window : latest.rl_window;
        var tcpWin = live.tcp_window != null ? live.tcp_window : latest.tcp_window;
        if (rlWin == null || tcpWin == null) {
          if (rlEl) {
            rlEl.textContent = '\u2014';
          }
          if (tcpEl) {
            tcpEl.textContent = '\u2014';
          }
          if (deltaEl) {
            deltaEl.className = 'zuul-rl-now-delta';
            deltaEl.textContent = 'Waiting for the first window reading\u2026';
          }
          if (legacy) {
            legacy.className = '';
            legacy.textContent = 'Live: waiting for window data\u2026';
          }
          return;
        }
        if (rlEl) {
          rlEl.textContent = String(rlWin);
        }
        if (tcpEl) {
          tcpEl.textContent = String(tcpWin);
        }
        var extraNow = Math.max(0, Math.round(Number(rlWin) - Number(tcpWin)));
        if (deltaEl) {
          if (extraNow > 0) {
            deltaEl.className = 'zuul-rl-now-delta zuul-rl-now-ahead';
            deltaEl.textContent =
              'RL is keeping the gate ' + extraNow + ' wider than TCP.';
          } else if (Number(rlWin) === Number(tcpWin)) {
            deltaEl.className = 'zuul-rl-now-delta';
            deltaEl.textContent = 'Both windows match right now.';
          } else {
            deltaEl.className = 'zuul-rl-now-delta';
            deltaEl.textContent = 'RL is slightly tighter than TCP.';
          }
        }
        if (legacy) {
          legacy.className = extraNow > 0 ? 'zuul-rl-sat-ok' : 'zuul-rl-sat-low';
          legacy.innerHTML =
            '<strong>Live</strong> \u00b7 RL <span class="zuul-rl-live-rl">' +
            rlWin + '</span> / TCP <span class="zuul-rl-live-tcp">' + tcpWin +
            '</span>';
        }
      }

      function renderDecisionReason(panel, metrics) {
        var el = panel.querySelector('#zuul-rl-decision-reason');
        if (!el) {
          return;
        }
        var latest = (metrics && metrics.latest) || {};
        var reason = latest.rl_decision_reason;
        var source = latest.rl_decision_source;
        var detail = latest.rl_decision_detail;
        function esc(s) {
          return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/"/g, '&quot;');
        }
        if (reason) {
          var short = shortenDecisionReason(reason);
          var rest = String(reason).trim();
          var tipParts = [];
          if (rest && rest !== short && rest !== short.replace(/\.$/, '')) {
            tipParts.push(rest);
          }
          if (source) {
            tipParts.push('method: ' + source);
          }
          if (detail) {
            tipParts.push(String(detail));
          }
          var tip = tipParts.length ? tipParts.join(' \u00b7 ') : '';
          var wasOpen = false;
          var prevDetails = el.querySelector('details.zuul-rl-reason-debug');
          if (prevDetails && prevDetails.open) {
            wasOpen = true;
          }
          var html = '<span class="zuul-rl-reason-label">Why:</span> ' +
            esc(short);
          if (tip) {
            html +=
              ' <details class="zuul-rl-reason-debug"' +
              (wasOpen ? ' open' : '') + '>' +
              '<summary>Details</summary>' +
              '<span class="zuul-rl-reason-debug-body">' + esc(tip) +
              '</span></details>';
            el.title = tip;
          } else {
            el.removeAttribute('title');
          }
          el.innerHTML = html;
        } else {
          el.innerHTML = '<span class="zuul-rl-reason-label">Why:</span> ' +
            'waiting for the first decision\u2026';
          el.removeAttribute('title');
        }
      }

      function renderSessionSummary(panel, metrics) {
        if (!panel || !metrics) {
          return;
        }
        var summary = getSessionSummary(metrics);
        var targetN = expectedFailuresFrom(metrics, null);
        DEMO_EXPECTED_FAILURES = targetN;
        var failN = summary.gate_failures || 0;
        var counts = (metrics && metrics.failure_counts) || {};
        if (counts.gate_jobs_total != null &&
            !isNaN(Number(counts.gate_jobs_total))) {
          failN = Math.max(
            failN, Math.max(0, Math.round(Number(counts.gate_jobs_total))));
        }
        var sessionExtra = summary.extra_changes_total || 0;
        var advPct = summary.rl_advantage_pct;
        var heldRl = summary.rl_held_peak;
        var heldTcp = summary.tcp_after_floor;
        var merged = summary.merged != null ?
          summary.merged : (summary.session_changes_merged || 0);
        var submitted = summary.changes_submitted != null ?
          summary.changes_submitted : (summary.submitted || 0);
        var el;

        el = panel.querySelector('#zuul-rl-hl-submitted');
        if (el) {
          el.textContent = String(submitted != null && !isNaN(Number(submitted)) ?
            submitted : 0);
        }
        el = panel.querySelector('#zuul-rl-hl-merged');
        if (el) {
          el.textContent = String(merged != null && !isNaN(Number(merged)) ?
            merged : 0);
        }
        el = panel.querySelector('#zuul-rl-hl-failures');
        if (el) {
          el.textContent = String(failN);
          var cycleFailsTotal = counts.gate_cycles_total != null &&
            !isNaN(Number(counts.gate_cycles_total)) ?
            Math.round(Number(counts.gate_cycles_total)) : null;
          if (cycleFailsTotal != null && cycleFailsTotal > failN) {
            el.title = failN + ' stamped job failure(s); ' + cycleFailsTotal +
              ' total cycle failure(s) including merge conflicts, which ' +
              'also shrink the window.';
          } else {
            el.removeAttribute('title');
          }
        }
        // Submitted = Merged + Dropped + In Progress (still queued, in
        // check, or building -- not evidence anything failed).
        // Dropped comes from the server when available (reported gate
        // failures that left the queue); otherwise fall back to failN.
        // "In progress" is always the residual, so the equation holds by
        // construction rather than relying on two independently-tracked
        // counts to happen to agree.
        var dropped = summary.dropped != null ?
          Number(summary.dropped) : failN;
        if (isNaN(dropped) || dropped < 0) {
          dropped = 0;
        }
        var subForMath = Number(submitted) || 0;
        var mergedForMath = Number(merged) || 0;
        var rescheduled = summary.rescheduled != null ?
          Number(summary.rescheduled) :
          Math.max(0, subForMath - mergedForMath - dropped);
        if (isNaN(rescheduled) || rescheduled < 0) {
          rescheduled = 0;
        }
        el = panel.querySelector('#zuul-rl-hl-dropped');
        if (el) {
          el.textContent = String(dropped);
        }
        el = panel.querySelector('#zuul-rl-hl-rescheduled');
        if (el) {
          el.textContent = String(rescheduled);
          // Residual = submitted - merged - dropped: mostly changes still
          // queued, in check, or currently building -- not evidence that
          // anything failed. dropped only counts stamped job failures, so
          // a merge-conflict dequeue that never ran a job also lands here
          // even though it won't actually be retried; call that out too
          // when it's actually happening.
          el.title = (cycleFailsTotal != null && cycleFailsTotal > failN) ?
            'Residual = submitted − merged − dropped. Mostly still ' +
              'queued, in check, or building. Also includes merge-conflict ' +
              'dequeues, which may not all be retried even though they are ' +
              'counted here rather than as dropped.' :
            'Residual = submitted − merged − dropped. Mostly still ' +
              'queued, in check, or building -- not evidence that anything failed.';
        }
        el = panel.querySelector('#zuul-rl-hl-extra');
        if (el) {
          el.textContent = String(sessionExtra);
        }
        el = panel.querySelector('#zuul-rl-hl-adv');
        if (el) {
          var idle = sessionExtra <= 0 && failN <= 0;
          if (advPct == null || isNaN(Number(advPct)) ||
              (Number(advPct) === 0 && idle)) {
            el.textContent = '\u2014';
          } else if (summary.advantage_capped &&
                     summary.rl_advantage_pct_raw != null) {
            // Show the real number even when the safety cap triggered \u2014
            // hiding it behind a "200%*" with the raw value only in a
            // hover tooltip previously made a genuine result look like
            // a display bug.
            el.textContent = Number(summary.rl_advantage_pct_raw) + '%';
          } else {
            el.textContent = Number(advPct) + '%';
          }
        }
        el = panel.querySelector('#zuul-rl-hl-peak');
        if (el) {
          if (heldRl != null && heldTcp != null &&
              !isNaN(Number(heldRl)) && !isNaN(Number(heldTcp))) {
            el.textContent = heldRl + ' / ' + heldTcp;
          } else {
            el.textContent = '\u2014';
          }
        }

        var doneBanner = panel.querySelector('#zuul-rl-done-banner');
        if (doneBanner) {
          var done = metrics.demo_phase === 'done' && !demoRunning;
          doneBanner.style.display = done ? 'block' : 'none';

          'max(0, RL_held \u2212 TCP_after). Same basis as job-runs saved (~1s gate jobs).';

          card.title = 'Successful gate merges this session.';
        }
        card = panel.querySelector('.zuul-rl-hl-fail');
        if (card) {
          card.title =
            'Failed (gate) / in conflict: stamped should_fail gate jobs and ' +
            'speculative merge failures (not git merge-conflict machinery). ' +
            'Shown as actual / expected. Feeds extras & job-runs saved.';
        }
        card = panel.querySelector('.zuul-rl-hl-extra');
        if (card) {
          card.title = tipExtra;
        }
        card = panel.querySelector('.zuul-rl-hl-adv');
        if (card) {
          card.title = tipAdv;
        }
        card = panel.querySelector('.zuul-rl-hl-peak');
        if (card) {
          card.title = tipPeak;
        }

            !isNaN(Number(metrics.demo_change_count))) {

      function renderComparisonTable(container, metrics) {
        if (!container) {
          return;
        }
        var cmp = metrics && metrics.comparison;
        var phase = metrics && metrics.demo_phase;
        var summary = getSessionSummary(metrics);
        var show = (phase === 'done' || (cmp && metrics.failures &&
          metrics.failures.length > 0)) && !demoRunning;
        if (!show) {
          container.style.display = 'none';
          container.innerHTML = '';
          return;
        }
        container.style.display = 'block';
        var expectedN = expectedFailuresFrom(metrics, null);
        var failN = summary.gate_failures || 0;
        var extras = summary.extra_changes_total || 0;
        var jobRuns = summary.job_runs_saved != null ?
          summary.job_runs_saved : extras;
        var advPct = summary.rl_advantage_pct;
        var heldRl = summary.rl_held_peak;
        var heldTcp = summary.tcp_after_floor;
        var merged = summary.merged != null ?
          summary.merged : (summary.session_changes_merged || 0);
        var submitted = summary.changes_submitted != null ?
          summary.changes_submitted : (summary.submitted || 0);
        if (cmp) {
          if (cmp.gate_failures != null) {
            failN = cmp.gate_failures;
          }
          if (cmp.expected_failures != null) {
            expectedN = cmp.expected_failures;
          }
          if (cmp.extra_changes_total != null) {
            extras = cmp.extra_changes_total;
          }
          if (cmp.job_runs_saved != null) {
            jobRuns = cmp.job_runs_saved;
          }
          if (cmp.rl_advantage_pct != null) {
            advPct = cmp.rl_advantage_pct;
          }
          if (cmp.rl_held_peak != null) {
            heldRl = cmp.rl_held_peak;
          }
          if (cmp.tcp_after_floor != null) {
            heldTcp = cmp.tcp_after_floor;
          }
          if (cmp.merged != null) {
            merged = cmp.merged;
          } else if (cmp.session_changes_merged != null) {
            merged = cmp.session_changes_merged;
          }
          if (cmp.changes_submitted != null) {
            submitted = cmp.changes_submitted;
          } else if (cmp.submitted != null) {
            submitted = cmp.submitted;
          }
        }
        function esc(s) {
          return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/"/g, '&quot;');
        }
        var advText = (advPct == null || isNaN(Number(advPct))) ?
          '\u2014' : (Number(advPct) + '%');
        var peakText = (heldRl != null && heldTcp != null) ?
          (heldRl + ' / ' + heldTcp) : '\u2014';
        var html = '<div class="zuul-rl-after-run">' +
          '<div class="zuul-rl-after-run-title">After run</div>' +
          '<div class="zuul-rl-after-run-grid">' +
          '<span class="label">Submitted</span>' +
          '<span class="value">' + esc(submitted) + '</span>' +
          '<span class="label">Merged</span>' +
          '<span class="value">' + esc(merged) + '</span>' +
          '<span class="label">Failed (gate)</span>' +
          '<span class="value">' + esc(failN) +
          (summary.cycle_failures_total != null &&
            Number(summary.cycle_failures_total) > failN ?
            ' <span style="opacity:.65;font-weight:normal">(' +
            esc(summary.cycle_failures_total) +
            ' incl. merge conflicts)</span>' : '') + '</span>' +
          '<span class="label" title="Measured only at gate-failure moments this session, not the whole run.">Extra accommodated vs TCP</span>' +
          '<span class="value">' + esc(extras) + '</span>' +
          '<span class="label" title="RL’s highest and TCP’s lowest window at gate-failure moments -- not the session’s overall peak/floor.">RL peak / TCP floor</span>' +
          '<span class="value">' + esc(peakText) + '</span>' +
          '<span class="label" title="Estimated from Extra accommodated vs TCP (gate-failure moments only).">Job-runs saved</span>' +
          '<span class="value">' + esc(jobRuns) + '</span>' +
          '<span class="label" title="Extra accommodated vs TCP as a percentage of TCP’s window, at those same gate-failure moments.">Advantage</span>' +
          '<span class="value">' + esc(advText) + '</span>' +
          '</div>';
        if (cmp && cmp.summary) {
          html += '<div class="zuul-rl-compare-summary">' +
            esc(cmp.summary) + '</div>';
        }
        html += '</div>';
        if (cmp && cmp.rows && cmp.rows.length) {
          html += '<div class="zuul-rl-chart-title" style="margin-top:8px" title="' +
            'Side-by-side outcome if only TCP shrank vs with the RL agent.">' +
            'Comparison detail (TCP only vs RL)</div><table><thead><tr>';
          (cmp.columns || []).forEach(function (c) {
            html += '<th>' + esc(c) + '</th>';
          });
          html += '</tr></thead><tbody>';
          (cmp.rows || []).forEach(function (row) {
            html += '<tr><td>' + esc(row.metric) + '</td><td>' +
              esc(row.tcp_only) + '</td><td>' + esc(row.with_rl) +
              '</td><td class="zuul-rl-benefit">' + esc(row.benefit) +
              '</td></tr>';
          });
          html += '</tbody></table>';
        }
        container.innerHTML = html;
      }

      function refreshAllParallel() {
        if (!window.location.pathname.includes('/status')) {
          return;
        }
        var panel = ensureReportPanel();
        Promise.all([
          fetch(CONTROL_BASE + '/live-metrics', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; }),
          fetch(CONTROL_BASE + '/status', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; }),
          fetch(CONTROL_BASE + '/demo-progress', { cache: 'no-store' })
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; })
        ]).then(function (results) {
          var metrics = results[0];
          var st = results[1];
          var prog = results[2];
          applyDemoInputDefaults(panel, metrics, st);
          if (metrics) {
            lastMetrics = metrics;
            panel.style.display = 'block';
            scheduleChartDraw(metrics, panel);
          }
          if (st) {
            var link = panel.querySelector('#zuul-rl-report-link');
            var mergedProg = prog || st.demo_progress || {};
            var running = !!(st.running || (prog && prog.running));
            syncDemoControlButtons(panel, mergedProg, running);
            if (link && st.latest_run) {
              link.href = REPORT_BASE + '/report.html?v=' + st.latest_run;
            }
            if (st.running) {
              demoRunning = true;
            }
          }
          if (prog && (prog.running || prog.phase === 'stopping')) {
            demoRunning = true;
            renderDemoProgress(prog);
          }
        });
      }

      function formatMinutesSaved(value) {
        if (value == null || isNaN(value)) {
          return '0';
        }
        if (value < 0.1) {
          return '<0.1';
        }
        return String(Math.round(value * 10) / 10);
      }

      function formatJobRunsSaved(value) {
        if (value == null || isNaN(value)) {
          return '0';
        }
        return String(Math.max(0, Math.round(Number(value))));
      }

      function resetChartsToBaseline() {
        var panel = document.getElementById(PANEL_ID);
        if (!panel) {
          return;
        }
        var metrics = baselineMetrics();
        lastMetrics = metrics;

        var windowCanvas = panel.querySelector('#zuul-rl-window-chart');
        var throughputCanvas = panel.querySelector('#zuul-rl-throughput-chart');
        var efficiencyCanvas = panel.querySelector('#zuul-rl-efficiency-chart');
        var extraCanvas = panel.querySelector('#zuul-rl-extra-chart');
        var executorCanvas = panel.querySelector('#zuul-rl-executor-chart');

        var compareEl = panel.querySelector('#zuul-rl-comparison');

        CHART_DEFS.window.draw(windowCanvas, metrics);
        CHART_DEFS.throughput.draw(throughputCanvas, metrics);
        CHART_DEFS.efficiency.draw(efficiencyCanvas, metrics);
        CHART_DEFS.extra.draw(extraCanvas, metrics);

      function tenantFromPath() {
        var match = window.location.pathname.match(/\/t\/([^/]+)/);
        return match ? match[1] : 'example-tenant';
      }

      function formatTime(ts) {
        if (!ts) {
          return '?';
        }
        return new Date(ts * 1000).toLocaleTimeString();
      }

      function formatQueue(q, mode) {
        var tcp = q.tcp_shadow_window != null ? q.tcp_shadow_window : '?';
        var rl = q.current_window != null ? q.current_window : '?';
        var delta = q.action_delta;
        var deltaStr = delta == null ? '' :
          ' (agent ' + (delta >= 0 ? '+' : '') + delta + ')';
        var modeNote = mode === 'shadow' ?
          'shadow mode — RL recommends only' : 'active — RL window applied';
        return q.name + ': <span class="zuul-rl-active">RL active window ' + rl +
          '</span> (applied now) · <span class="zuul-rl-tcp">TCP baseline ' + tcp +
          '</span> (shadow, not applied) · ' + modeNote + deltaStr;
      }

        var banner = document.getElementById(BANNER_ID);

        banner.style.display = 'none';

        banner.style.right = '0';
        banner.style.zIndex = '10000';

      function triggerDemo() {
        var panel = ensureReportPanel();
        var btn = panel.querySelector('#zuul-rl-run-btn');
        var totalInput = panel.querySelector('#zuul-rl-total-changes');
        var failsInput = panel.querySelector('#zuul-rl-gate-failures');
        var body = {};
        var totalVal = totalInput && totalInput.value !== '' ?
          Number(totalInput.value) : null;
        var failsVal = failsInput && failsInput.value !== '' ?
          Number(failsInput.value) : null;
        if (totalVal != null && (!isFinite(totalVal) || totalVal < 0)) {
          var statusBad = panel.querySelector('#zuul-rl-status');
          if (statusBad) {
            statusBad.textContent = 'Changes must be a number \u2265 0.';
            statusBad.className = 'zuul-rl-status-line zuul-rl-status-error';
          }
          return;
        }
        if (failsVal != null && (!isFinite(failsVal) || failsVal < 0)) {
          var statusBad2 = panel.querySelector('#zuul-rl-status');
          if (statusBad2) {
            statusBad2.textContent = 'Fails must be a number \u2265 0 (gate job failures).';
            statusBad2.className = 'zuul-rl-status-line zuul-rl-status-error';
          }
          return;
        }
        if (totalVal != null && failsVal != null && failsVal > totalVal) {
          var statusBad3 = panel.querySelector('#zuul-rl-status');
          if (statusBad3) {
            statusBad3.textContent = 'Fails must be \u2264 Changes.';
            statusBad3.className = 'zuul-rl-status-line zuul-rl-status-error';
          }
          return;
        }
        if (totalVal != null) {
          body.total_changes = Math.floor(totalVal);
        }
        if (failsVal != null) {
          body.gate_failures = Math.floor(failsVal);
        }
        if (btn) {
          btn.disabled = true;
          btn.textContent = 'Starting...';
        }
        resetChartsToBaseline();
        startDemoPolling();
        renderDemoProgress({
          phase: 'starting',
          message: 'Sending run-demo request\u2026',
          percent: 1
        });
        fetch(CONTROL_BASE + '/run-demo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        })
          .then(function (resp) {
            if (!resp.ok) {
              return resp.json().then(function (err) {
                throw new Error((err && err.message) || 'run-demo failed');
              }).catch(function (e) {
                if (e && e.message && e.message !== 'run-demo failed') {
                  throw e;
                }
                throw new Error('run-demo failed');
              });
            }
            return resp.json();
          })
          .then(function (data) {
            if (data.expected_failures != null &&
                !isNaN(Number(data.expected_failures))) {
              DEMO_EXPECTED_FAILURES = Math.max(
                0, Math.round(Number(data.expected_failures)));
            }
            if (data.total_changes != null &&
                !isNaN(Number(data.total_changes))) {
              DEMO_CHANGE_COUNT = Math.max(
                0, Math.round(Number(data.total_changes)));
            }
            var failCard = panel.querySelector('#zuul-rl-hl-failures');
            if (failCard) {
              failCard.textContent = '0';
            }
            renderDemoProgress({
              phase: data.phase || 'starting',
              message: data.message || 'Demo started',
              percent: 2,
              expected_failures: DEMO_EXPECTED_FAILURES,
              total_changes: data.total_changes
            });
            refreshAllParallel();
          })
          .catch(function (err) {
            stopDemoPolling();
            if (btn) {
              btn.disabled = false;
              btn.textContent = 'Run demo';
            }
            var status = panel.querySelector('#zuul-rl-status');
            if (status) {
              status.textContent = (err && err.message) ?
                err.message :
                'Failed to start demo \u2014 is rl-control running?';
              status.className = 'zuul-rl-status-line zuul-rl-status-error';
            }
          });
      }

      function drawLineChart(canvas, series, options) {
        if (!canvas || !series || !series.length) {
          return;
        }
        var ctx = canvas.getContext('2d');
        if (!ctx) {
          return;
        }
        var w = canvas.width;
        var h = canvas.height;
        var pad = { top: 12, right: 10, bottom: 22, left: 36 };
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#fafafa';
        ctx.fillRect(0, 0, w, h);

        var allY = [];
        series.forEach(function (s) {
          (s.values || []).forEach(function (v) {
            if (v != null && !isNaN(v)) {
              allY.push(v);
            }
          });
        });
        var primaryVals = (series[0] && series[0].values) || [];
        var n = primaryVals.length;
        if (!allY.length || n === 0) {
          ctx.fillStyle = '#6a6e73';
          ctx.font = '11px sans-serif';
          ctx.fillText(
            (options && options.emptyText) || 'Waiting for agent ticks\u2026',
            pad.left, h / 2);
          return;
        }

        var minY = Math.min.apply(null, allY);
        var maxY = Math.max.apply(null, allY);
        if (options && options.yMin != null && !isNaN(Number(options.yMin))) {
          minY = Math.min(minY, Number(options.yMin));
        }
        if (options && options.ylabel &&
            options.ylabel.indexOf('window') === 0) {
          minY = Math.max(1, minY - 1);
          maxY = Math.min(50, maxY + 1);
          if (maxY - minY < 4) {
            var mid = (minY + maxY) / 2;
            minY = Math.max(1, mid - 2);
            maxY = Math.min(50, mid + 2);
          }
        } else if (minY === maxY) {
          minY -= 1;
          maxY += 1;
        }
        var plotW = w - pad.left - pad.right;
        var plotH = h - pad.top - pad.bottom;
        var xAt = function (i) {
          return pad.left + (n <= 1 ? plotW / 2 : (i / (n - 1)) * plotW);
        };
        var yAt = function (v) {
          return pad.top + plotH - ((v - minY) / (maxY - minY)) * plotH;
        };

        var yTicks = 4;
        ctx.strokeStyle = '#d2d2d2';
        ctx.lineWidth = 1;
        for (var g = 0; g <= yTicks; g++) {
          var gy = pad.top + (g / yTicks) * plotH;
          ctx.beginPath();
          ctx.moveTo(pad.left, gy);
          ctx.lineTo(w - pad.right, gy);
          ctx.stroke();
        }

        ctx.fillStyle = '#6a6e73';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'right';
        for (var gl = 0; gl <= yTicks; gl++) {
          var glY = pad.top + (gl / yTicks) * plotH;
          var glVal = maxY - (gl / yTicks) * (maxY - minY);
          var glBaseline = gl === 0 ? glY + 4 :
            (gl === yTicks ? glY : glY + 3);
          ctx.fillText(_axisLabel(glVal), pad.left - 4, glBaseline);
        }

        if (options && options.timestamps && options.timestamps.length) {
          ctx.textAlign = 'center';
          var t0 = options.timestamps[0];
          var tN = options.timestamps[options.timestamps.length - 1];
          ctx.fillText(formatTime(t0), pad.left, h - 6);
          ctx.fillText(formatTime(tN), w - pad.right, h - 6);
        }

        if (options && options.failures && options.timestamps) {
          // Every failure always gets its dashed line — the visible line
          // count must match the true total. Only the "#N" text label is
          // skipped when it would collide with the previous one, so dense
          // clusters don't render as illegible overlapping digits; the
          // "Recent failures" list below always has the full detail for
          // every failure regardless of chart density.
          var lastLabelX = -Infinity;
          var MIN_LABEL_GAP = 16;
          options.failures.forEach(function (fail) {
            var idx = 0;
            var best = Infinity;
            for (var fi = 0; fi < options.timestamps.length; fi++) {
              var d = Math.abs(options.timestamps[fi] - fail.timestamp);
              if (d < best) {
                best = d;
                idx = fi;
              }
            }
            var fx = xAt(idx);
            ctx.strokeStyle = '#c9190b';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(fx, pad.top);
            ctx.lineTo(fx, pad.top + plotH);
            ctx.stroke();
            ctx.setLineDash([]);
            var canLabel = (fx - lastLabelX) >= MIN_LABEL_GAP;
            if (fail.session_index != null && canLabel) {
              ctx.fillStyle = '#c9190b';
              ctx.font = 'bold 9px sans-serif';
              ctx.textAlign = 'center';
              ctx.fillText('#' + fail.session_index, fx, pad.top + 10);
              lastLabelX = fx;
            }
            if (options.showChangeIds && fail.change && canLabel) {
              var cid = String(fail.change);
              // Prefer bare change number when "project N,ps"
              var m = cid.match(/(\d+)(?:,\d+)?$/);
              var shortId = m ? m[1] : cid.slice(0, 8);
              ctx.fillStyle = '#a30000';
              ctx.font = '8px sans-serif';
              ctx.fillText(shortId, fx, pad.top + plotH - 2);
            }
          });
        }

        series.forEach(function (s) {
          ctx.strokeStyle = s.color;
          ctx.lineWidth = 2;
          ctx.beginPath();
          var started = false;
          for (var i = 0; i < s.values.length; i++) {
            var v = s.values[i];
            if (v == null || isNaN(v)) {
              started = false;
              continue;
            }
            var x = xAt(i);
            var y = yAt(v);
            if (!started) {
              ctx.moveTo(x, y);
              started = true;
            } else {
              ctx.lineTo(x, y);
            }
          }
          ctx.stroke();
        });

        // Per-failure annotation: amber down-arrow where TCP dropped,
        // blue dot where RL held — makes the divergence story explicit.
        if (options && options.annotateWindows && options.failures &&
            options.timestamps && series.length >= 2) {
          options.failures.forEach(function (fail) {
            var idx = 0;
            var best = Infinity;
            for (var fi = 0; fi < options.timestamps.length; fi++) {
              var d = Math.abs(options.timestamps[fi] - fail.timestamp);
              if (d < best) {
                best = d;
                idx = fi;
              }
            }
            var fx = xAt(idx);
            var rlV = series[0].values[idx];
            var tcpV = series[1].values[idx];
            if (tcpV != null && !isNaN(tcpV)) {
              var ty = yAt(tcpV);
              ctx.fillStyle = '#c46100';
              ctx.beginPath();
              ctx.moveTo(fx - 4, ty - 7);
              ctx.lineTo(fx + 4, ty - 7);
              ctx.lineTo(fx, ty - 1);
              ctx.closePath();
              ctx.fill();
            }
            if (rlV != null && !isNaN(rlV)) {
              var ry = yAt(rlV);
              ctx.fillStyle = '#06c';
              ctx.beginPath();
              ctx.arc(fx, ry, 2.6, 0, Math.PI * 2);
              ctx.fill();
            }
          });
        }

        if (options && options.ylabel) {
          ctx.save();
          ctx.translate(10, pad.top + plotH / 2);
          ctx.rotate(-Math.PI / 2);
          ctx.fillStyle = '#6a6e73';
          ctx.font = '10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(options.ylabel, 0, 0);
          ctx.restore();
        }
      }

      function drawExtraBarChart(canvas, failures) {
        if (!canvas) {
          return;
        }
        var ctx = canvas.getContext('2d');
        if (!ctx) {
          return;
        }
        var w = canvas.width;
        var h = canvas.height;
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#fafafa';
        ctx.fillRect(0, 0, w, h);
        var pad = { top: 14, right: 8, bottom: 22, left: 28 };
        if (!failures || !failures.length) {
          ctx.fillStyle = '#6a6e73';
          ctx.font = '11px sans-serif';
          ctx.fillText('Extra slots appear at each gate failure\u2026', pad.left, h / 2);
          return;
        }
        var vals = failures.map(function (f) {
          var v = f.extra_changes != null ? f.extra_changes :
            (f.changes_in_window_delta != null ? f.changes_in_window_delta : 0);
          v = Number(v);
          return isNaN(v) ? 0 : v;
        });
        var maxY = Math.max(1, Math.max.apply(null, vals));
        var plotW = w - pad.left - pad.right;
        var plotH = h - pad.top - pad.bottom;
        var barW = Math.max(8, (plotW / vals.length) * 0.6);
        ctx.fillStyle = '#6a6e73';
        ctx.font = '9px sans-serif';
        ctx.textAlign = 'right';
        ctx.fillText(String(maxY), pad.left - 4, pad.top + 4);
        ctx.fillText('0', pad.left - 4, pad.top + plotH);
        vals.forEach(function (v, i) {
          var x = pad.left + ((i + 0.5) / vals.length) * plotW - barW / 2;
          var bh = (v / maxY) * plotH;
          var y = pad.top + plotH - bh;
          ctx.fillStyle = v > 0 ? '#06c' : '#d2d2d2';
          ctx.fillRect(x, y, barW, Math.max(bh, v > 0 ? 2 : 0));
          ctx.fillStyle = '#151515';
          ctx.font = '9px sans-serif';
          ctx.textAlign = 'center';
          var label = failures[i].change ?
            String(failures[i].change).replace(/^.*\s/, '').split(',')[0] :
            '#' + (failures[i].session_index || (i + 1));
          ctx.fillText(label, x + barW / 2, h - 6);
          if (v > 0) {
            ctx.fillStyle = '#06c';
            ctx.font = 'bold 9px sans-serif';
            ctx.fillText('+' + v, x + barW / 2, y - 2);
          }
        });
      }

      function renderFailures(container, failures, failureCounts, metrics) {
        if (!container) {
          return;
        }
        if (!failures || !failures.length) {
          container.innerHTML = '';
          return;
        }
        var html = '<strong>Recent failures</strong>';
        failures.slice().reverse().forEach(function (f) {
          var tip = '';
          if (f.extra_changes != null) {
            tip = ' title="Extra changes at this failure: ' + f.extra_changes +
              ' (RL ' + (f.rl_window != null ? f.rl_window : '?') +
              ' − TCP ' +
              (f.tcp_window_after != null ? f.tcp_window_after :
                (f.tcp_window != null ? f.tcp_window : '?')) + ')"';
          }
          if (f.impact_text) {
            html += '<div class="zuul-rl-failure-row"' + tip + '>' +
              f.impact_text + '</div>';
            return;
          }
          var rl = f.rl_window != null ? f.rl_window : '?';
          var change = f.change || 'unknown';
          var extra = f.extra_changes != null ? f.extra_changes : 0;
          if (f.tcp_window_before != null && f.tcp_window_after != null) {
            html += '<div class="zuul-rl-failure-row"' + tip + '>Change ' +
              change + ' failed → TCP shrunk ' + f.tcp_window_before + '→' +
              f.tcp_window_after + '; RL held ' + rl +
              (extra > 0 ? ' (+' + extra + ' extra)' : '') + '</div>';
          } else {
            html += '<div class="zuul-rl-failure-row"' + tip + '>Change ' +
              change + ' failed → RL ' + rl + ' / TCP ' +
              (f.tcp_window != null ? f.tcp_window : '?') + '</div>';
          }
        });
        container.innerHTML = html;
      }

      function updateLiveMetrics() {
        if (!window.location.pathname.includes('/status')) {
          var existing = document.getElementById(PANEL_ID);
          if (existing) {
            existing.style.display = 'none';
          }
          return;
        }
        if (metricsInFlight) {
          return;
        }
        metricsInFlight = true;
        var panel = ensureReportPanel();
        fetch(CONTROL_BASE + '/live-metrics', { cache: 'no-store' })
          .then(function (resp) {
            if (!resp.ok) {
              throw new Error('live metrics unavailable');
            }
            return resp.json();
          })
          .then(function (metrics) {
            liveMetricsFailStreak = 0;
            lastMetrics = metrics;
            panel.style.display = 'block';
            scheduleChartDraw(metrics, panel);
          })
          .catch(function () {
            liveMetricsFailStreak += 1;
            var panel = document.getElementById(PANEL_ID);
            if (panel) {
              panel.style.display = 'block';
              var status = panel.querySelector('#zuul-rl-status');
              if (status &&
                  liveMetricsFailStreak >= CONN_LOST_AFTER_FAILURES) {
                status.textContent = demoRunning ?
                  'Connection lost \u2014 retrying\u2026 charts show last ' +
                  'known values.' :
                  'Live monitor offline \u2014 start rl-control on port 19100.';
                status.className = 'zuul-rl-status-line zuul-rl-status-error';
              }
            }
          })
          .finally(function () {
            metricsInFlight = false;
          });
      }

      function updateReportPanel() {
        if (!window.location.pathname.includes('/status')) {
          return;
        }
        var panel = ensureReportPanel();
        fetch(CONTROL_BASE + '/status', { cache: 'no-store' })
          .then(function (resp) {
            if (!resp.ok) {
              throw new Error('control service unavailable');
            }
            return resp.json();
          })
          .then(function (st) {
            var link = panel.querySelector('#zuul-rl-report-link');
            var status = panel.querySelector('#zuul-rl-status');
            var prog = st.demo_progress || {};
            var stopping = !!(st.running && (
              prog.stopping || prog.phase === 'stopping'));
            syncDemoControlButtons(panel, prog, !!st.running);
            if (status) {
              status.className = 'zuul-rl-status-line';
              if (stopping) {
                if (!demoRunning) {
                  startDemoPolling();
                }
                demoRunning = true;
                renderDemoProgress(prog);
                status.textContent = prog.message ||
                  'Stopping demo\u2026 clearing queues';
                status.className += ' zuul-rl-status-running';
              } else if (st.running || demoRunning) {
                if (!demoRunning) {
                  startDemoPolling();
                }
                if (st.demo_progress) {
                  renderDemoProgress(st.demo_progress);
                }
                if (!lastMetrics || !demoRunning) {
                  status.textContent =
                    'Demo scenario running \u2014 see progress above.';
                  status.className += ' zuul-rl-status-running';
                }
              } else if (prog.phase === 'cancelled') {
                status.textContent = prog.message ||
                  'Demo stopped. Click Run demo to start.';
              } else if (st.last_error) {
                status.textContent = 'Last demo run failed: ' + st.last_error;
                status.className += ' zuul-rl-status-error';
              } else if (st.latest && st.latest.rl_window != null) {
                status.textContent =
                  'Live — session & live metrics below.';
                status.className += ' zuul-rl-status-live';
              } else if (st.latest_run) {
                status.textContent =
                  'Idle \u2014 latest report ' + st.latest_run +
                  ' (graphs still refresh from live audit data).';
              } else {
                status.textContent =
                  'Live \u2014 waiting for RL agent ticks and gate traffic.';
                status.className += ' zuul-rl-status-live';
              }
            }
            if (link && st.latest_run) {
              link.href = REPORT_BASE + '/report.html?v=' + st.latest_run;
            }
            panel.style.display = 'block';
          })
          .catch(function () {});
      }

      function render(data) {
        if (!window.location.pathname.includes('/status')) {
          var existing = document.getElementById(BANNER_ID);
          if (existing) {
            existing.style.display = 'none';
          }
          return;
        }

        var banner = ensureBanner();
        placeBanner(banner);

        if (demoRunning) {
          banner.style.display = 'block';
          banner.innerHTML =
            '<span class="zuul-rl-banner-title">RL demo in progress</span> ' +
            '<span class="zuul-rl-mode">Watch the progress panel (bottom-right): ' +
            'clearing queues \u2192 check \u2192 Verified+1 \u2192 gate \u2192 processing. ' +
            'Gate cards show one <strong>RL</strong> + one <strong>TCP</strong> summary each.</span>';
          return;
        }

        var parts = [];
        (data.pipelines || []).forEach(function (pipeline) {
          var rl = pipeline.rl_window;
          if (!rl || !rl.queues || !rl.queues.length) {
            return;
          }
          var q = rl.queues[0];
          var rlWin = q.current_window != null ? q.current_window : '?';
          var tcpWin = q.tcp_shadow_window != null ? q.tcp_shadow_window : '?';
          parts.push('<strong>' + pipeline.name + '</strong> ' +
            '<span class="zuul-rl-active">RL ' + rlWin + '</span> ' +
            '<span class="zuul-rl-tcp">TCP ' + tcpWin + '</span>');
        });

        if (!parts.length) {
          banner.style.display = 'none';
          return;
        }
        banner.style.display = 'block';
        var gate = (data.pipelines || []).find(function (p) {
          return p.name === 'gate';
        });
        var mode = gate && gate.rl_window ? gate.rl_window.mode : 'active';
        var modeLine = mode === 'shadow' ?
          'Shadow mode — TCP baseline still governs Zuul.' :
          'Active mode — RL window applied to gate.';
        banner.innerHTML =
          '<span class="zuul-rl-banner-title">' +
          'RL vs Traditional TCP Window — Live Comparison</span> ' +
          '<span class="zuul-rl-mode">' + modeLine +
          ' Blue = RL (applied). Amber = TCP shadow baseline.</span> &nbsp;|&nbsp; ' +
          parts.join(' &nbsp;|&nbsp; ');
      }

      function removeStrayQueueBadges() {
        document.querySelectorAll('.zuul-rl-queue-badge').forEach(function (badge) {
          if (!badge.closest('.zuul-pipeline-summary')) {
            badge.remove();
          }
        });
      }

      function enhanceBadges(data) {
        removeStrayQueueBadges();
        (data.pipelines || []).forEach(function (pipeline) {
          var rl = pipeline.rl_window;
          if (!rl || !rl.queues || !rl.queues.length) {
            return;
          }
          var q = rl.queues[0];
          var rlWin = q.current_window != null ? q.current_window : '?';
          var tcpWin = q.tcp_shadow_window != null ? q.tcp_shadow_window : '?';

          document.querySelectorAll('.zuul-pipeline-summary').forEach(function (card) {
            var link = card.querySelector('a.zuul-pipeline-link');
            if (!link || link.textContent.trim() !== pipeline.name) {
              return;
            }
            var rlTag = card.querySelector('.zuul-rl-queue-badge.zuul-rl-badge-active');
            if (!rlTag) {
              rlTag = document.createElement('span');
              rlTag.className = 'zuul-rl-queue-badge zuul-rl-badge-active';
              link.insertAdjacentElement('afterend', rlTag);
            }
            rlTag.textContent = 'RL ' + rlWin;

            var tcpTag = card.querySelector('.zuul-rl-queue-badge.zuul-rl-badge-tcp');
            if (!tcpTag) {
              tcpTag = document.createElement('span');
              tcpTag.className = 'zuul-rl-queue-badge zuul-rl-badge-tcp';
              rlTag.insertAdjacentElement('afterend', tcpTag);
            }
            tcpTag.textContent = 'TCP ' + tcpWin;
          });
        });
      }

      function scheduleBadgeEnhance(data) {
        if (badgeEnhanceTimer) {
          clearTimeout(badgeEnhanceTimer);
        }
        badgeEnhanceTimer = setTimeout(function () {
          badgeEnhanceTimer = null;
          enhanceBadges(data);
        }, 300);
      }

      function nudgeZuulGridRefresh() {
        if (!window.location.pathname.includes('/status')) {
          return;
        }
        var btn = document.querySelector('.zuul-reload-button button');
        if (btn && !btn.disabled) {
          btn.click();
        }
      }

      function scheduleStatusPollInterval() {
        if (statusPollTimer) {
          clearInterval(statusPollTimer);
        }
        var ms = demoRunning ? STATUS_POLL_DEMO_MS : STATUS_POLL_MS;
        statusPollTimer = setInterval(pollStatus, ms);
      }

      function pollStatus() {
        if (!window.location.pathname.includes('/status')) {
          return;
        }
        var tenant = tenantFromPath();
        fetch('/api/tenant/' + tenant + '/status')
          .then(function (r) { return r.json(); })
          .then(function (data) {
            lastStatusData = data;
            render(data);
            scheduleBadgeEnhance(data);
          })
          .catch(function () {});
      }

      function startLiveMonitoring() {
        refreshAllParallel();
        pollStatus();
        scheduleStatusPollInterval();
        scheduleGridRefresh();
      }

      setInterval(updateLiveMetrics, LIVE_POLL_MS);
      setInterval(updateReportPanel, LIVE_POLL_MS * 2);
      startLiveMonitoring();

      var root = document.getElementById('root');
      if (root) {
        var moTimer = null;
        new MutationObserver(function () {
          if (!window.location.pathname.includes('/status') || !lastStatusData) {
            return;
          }
          clearTimeout(moTimer);
          moTimer = setTimeout(function () {
            scheduleBadgeEnhance(lastStatusData);
          }, 600);
        }).observe(root, {
          childList: true,
          subtree: true,
        });
      }
    })();
    </script>
    <!-- zuul-rl-overlay-end -->

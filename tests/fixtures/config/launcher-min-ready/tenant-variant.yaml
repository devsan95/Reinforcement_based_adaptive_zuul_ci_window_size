- tenant:
    name: tenant-one
    source:
      gerrit:
        config-projects:
          - common-config:
              exclude: image
        untrusted-projects:
          - org/project1:
              extra-config-paths:
                - zuul-extra.d/
              include-provider-config: true

- tenant:
    name: tenant-two
    source:
      gerrit:
        config-projects:
          - common-config
        untrusted-projects:
          - org/project2:
              extra-config-paths:
                - zuul-extra.d/
              include-provider-config: true

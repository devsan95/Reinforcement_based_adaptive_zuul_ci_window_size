- image:
    name: ubuntu-xenial
    type: cloud

- flavor:
    name: normal

- label:
    name: ubuntu-xenial
    image: ubuntu-xenial
    flavor: normal

- label:
    name: label1
    image: ubuntu-xenial
    flavor: normal

- label:
    name: label2
    image: ubuntu-xenial
    flavor: normal

- section:
    name: aws-us-east-1
    region: us-east-1
    connection: aws
    launch-timeout: 600
    launch-attempts: 2
    object-storage:
      bucket-name: zuul
    label-defaults:
      host-key-checking: false
      boot-timeout: 300
      key-name: zuul
    flavors:
      - name: normal
        instance-type: t3.medium
    images:
      - name: ubuntu-xenial
        image-id: ami-1e749f67

- provider:
    name: aws-us-east-1-main
    section: aws-us-east-1
    labels:
      - name: ubuntu-xenial
      - name: label1
      - name: label2

- pipeline:
    name: check
    manager: independent
    trigger:
      gerrit:
        - event: patchset-created
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- pipeline:
    name: image
    manager: independent
    trigger:
      zuul:
        - event: image-build
    success:
      zuul:
        image-built: true
        image-validated: true

- job:
    name: base
    parent: null
    run: playbooks/base.yaml
    nodeset:
      nodes:
        - label: ubuntu-xenial
          name: controller

- job:
    name: build-debian-local-image
    image-build-name: debian-local

- project:
    name: org/common-config
    image:
      jobs:
        - build-debian-local-image
        
- image:
    name: debian-local
    type: zuul

- flavor:
    name: normal

- label:
    name: debian-local-normal
    image: debian-local
    flavor: normal

- section:
    name: azure-base
    abstract: true
    connection: azure
    launch-timeout: 600
    launch-attempts: 2
    label-defaults:
      host-key-checking: false
      boot-timeout: 120
      key-data: ssh-rsa 
      subnet-id: /subscriptions/c35cf7df-ed75-4c85-be00-535409a85120/resourceGroups/nodepool/providers/Microsoft.Network/virtualNetworks/NodePool/subnets/default
    flavors:
      - name: normal
        vm-size: Standard_B1ls
    images:
      - name: debian-local

- section:
    name: azure-centralus
    parent: azure-base
    region: centralus

- provider:
    name: azure-main
    section: azure-centralus
    labels:
      - name: debian-local-normal
    resource-group: nodepool

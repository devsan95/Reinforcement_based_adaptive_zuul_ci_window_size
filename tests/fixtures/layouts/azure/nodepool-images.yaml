- pipeline:
    name: check
    manager: independent
    trigger:
      gerrit:
        - event: patchset-created
    success:
      gerrit:
        Verified: 1
    failure:
      gerrit:
        Verified: -1

- image:
    name: debian-id
    type: cloud

- image:
    name: debian-filter
    type: cloud

- image:
    name: debian-community
    type: cloud

- image:
    name: debian-shared
    type: cloud

- flavor:
    name: normal

- label:
    name: debian-normal-id
    image: debian-id
    flavor: normal

- label:
    name: debian-normal-filter
    image: debian-filter
    flavor: normal

- label:
    name: debian-normal-community
    image: debian-community
    flavor: normal

- label:
    name: debian-normal-shared
    image: debian-shared
    flavor: normal

- section:
    name: azure-base
    abstract: true
    connection: azure
    launch-timeout: 600
    launch-attempts: 2
    label-defaults:
      host-key-checking: false
      boot-timeout: 120
      key-data: ssh-rsa 
      subnet-id: /subscriptions/c35cf7df-ed75-4c85-be00-535409a85120/resourceGroups/nodepool/providers/Microsoft.Network/virtualNetworks/NodePool/subnets/default
    flavors:
      - name: normal
        vm-size: Standard_B1ls
    images:
      - name: debian-id
        image-id: /subscriptions/c35cf7df-ed75-4c85-be00-535409a85120/resourceGroups/nodepool/providers/Microsoft.Compute/images/test-image-1234
      - name: debian-filter
        image-filter:
          name: test1
      - name: debian-community
        community-gallery-image:
          gallery-name: community-gallery
          name: community-image
          version: latest
      - name: debian-shared
        shared-gallery-image:
          gallery-name: shared-gallery
          name: shared-image
          version: latest

- section:
    name: azure-centralus
    parent: azure-base
    region: centralus

- provider:
    name: azure-main
    section: azure-centralus
    labels:
      - name: debian-normal-id
      - name: debian-normal-filter
      - name: debian-normal-community
      - name: debian-normal-shared
    resource-group: nodepool
